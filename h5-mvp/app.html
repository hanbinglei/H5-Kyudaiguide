/* ── 数据加载态 ─────────────────────────────────────
   小程序侧的占位只能盖到 web-view 的 bindload（HTML 文档到位）为止；
   而这张图真正花时间的是之后那两三 MB 校园数据 —— 那段只有 H5 自己知道进度。
   web-view 的 postMessage 只在后退/销毁/分享时投递，实时信号传不回小程序，
   所以这一层必须由 H5 自己画、自己撤。

   撤的时机是 Promise.all 落地（renderBuildings 之后），不是 DOMContentLoaded ——
   后者一到就撤的话，用户会盯着一张空白的地图，比继续显示「正在载入」更糟。 */
#dataload {
  position: fixed; inset: 0; z-index: 1200;
  background: #F1EFEA;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  font: 14px/1.6 -apple-system, "PingFang SC", "Hiragino Sans", sans-serif;
  color: #666;
  transition: opacity .28s ease;
}
#dataload.gone { opacity: 0; pointer-events: none; }
#dataload .dl-grid { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; width: 72%; max-width: 300px; margin-bottom: 22px; }
#dataload .dl-b { border-radius: 5px; background: #E3DFD7; position: relative; overflow: hidden; }
#dataload .dl-b::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.8), transparent);
  transform: translateX(-100%);
  animation: dl-sweep 1.3s ease-in-out infinite;
}
@keyframes dl-sweep { 100% { transform: translateX(100%); } }
#dataload .dl-t { font-size: 15px; color: #555; }
#dataload .dl-s { font-size: 12px; color: #999; margin-top: 6px; }
@media (prefers-reduced-motion: reduce) { #dataload .dl-b::after { animation: none; } }

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
  #map { width: 100%; height: 100%; background: #f8f6f2; }

  /* ===== 顶部搜索栏 ===== */
  #topbar {
    position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
    width: min(480px, calc(100vw - 20px)); z-index: 1100;
  }
  #searchbox {
    display: flex; align-items: center; gap: 6px;
    background: #fff; border-radius: 12px; padding: 8px 12px;
    box-shadow: 0 2px 14px rgba(0,0,0,0.18);
  }
  #searchbox input {
    flex: 1; border: none; outline: none; font-size: 15px; min-width: 0;
  }
  #langswitch {
    border: none; background: #f5f5f5; border-radius: 8px; padding: 4px 6px;
    font-size: 12px; color: #555; cursor: pointer; outline: none;
  }

  /* 类别快捷片（食堂/商店/厕所/巴士…） */
  #chips { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  #chips button {
    border: none; border-radius: 14px; padding: 5px 11px; font-size: 12px;
    background: rgba(255,255,255,0.93); box-shadow: 0 1px 6px rgba(0,0,0,0.12);
    cursor: pointer; color: #444;
  }
  #chips button.active { background: #8b1f41; color: #fff; }

  #results {
    margin-top: 6px; background: #fff; border-radius: 12px; overflow: hidden;
    box-shadow: 0 2px 14px rgba(0,0,0,0.18); max-height: 46vh; overflow-y: auto;
    display: none;
  }
  .result-item { padding: 10px 14px; cursor: pointer; border-bottom: 1px solid #f2f2f2; }
  .result-item:hover { background: #faf5f7; }
  .result-item .r-name { font-size: 14px; color: #222; }
  .result-item .r-sub { font-size: 11px; color: #999; margin-top: 2px; }
  .result-item .r-tag {
    display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 4px;
    background: #f0e6ea; color: #8b1f41; margin-right: 6px; vertical-align: 1px;
  }
  /* 办公室窗口：绿色，和教室的酒红区分开 —— 两者的行动含义完全不同
     （教室是去上课，窗口是去办事、有营业时间、可能要预约） */
  .result-item .r-tag-office { background: #e6f7ee; color: #07835a; }
  /* 他校区：灰色 + 整条降透明度，视觉上就告诉你「这条你去不了」 */
  .result-item .r-tag-away { background: #eee; color: #888; }
  .result-item-off { opacity: .62; }
  /* 模糊兜底的结果必须显式标注，否则会被当成精确答案 */
  /* 行驶中的巴士。
     过渡时长与 BUS_TICK_MS 一致：每秒给一个新位置，浏览器把这一秒补满，
     视觉上就是连续移动而不是每秒一跳。linear 而非 ease —— 巴士是匀速的，
     用缓动会让它每秒起步一次、到点一停，比跳格还怪。
     ⚠️ Leaflet 用 transform 定位 marker，所以过渡的是 transform，不是 left/top。 */
  /* ⚠️ 千万不要在这里写 position: relative。
     Leaflet 的 .leaflet-marker-icon 是 position:absolute，写 relative 会把它
     覆盖掉，marker 于是回到正常文档流里一个叠一个往下排 —— 第 N 辆车比正确
     位置低 15px×(N-1)（15px = iconAnchor 的一半，divIcon 用负 margin 定位）。
     实测同屏 7 辆时最后一辆偏 90px，而且缩放/平移会改变视野内的车辆集合，
     于是一动全体跳位，看着就是「车飘出道路」（2026-08-17 用户反馈）。
     内部的 .bus-ring / .bus-dot 用不着它 —— absolute 本身就是包含块。 */
  .bus-marker { transition: transform 1s linear; }
  /* ⚠️ 缩放/平移期间必须把过渡关掉。
     Leaflet 用 transform 给 marker 定位，而我们又把 transform 做成了动画属性——
     于是【地图重定位】和【车沿路前进】用的是同一个通道，浏览器分不出来，
     把重定位也当成一秒的补间播出去：行内 style 已经是新坐标了，屏幕上却还在
     旧位置慢慢滑，看起来就是车脱离道路乱飘（2026-08-17 用户报的就是这个）。
     实测缩放两级后偏差 238px。 */
  .bus-frozen .bus-marker, .bus-frozen .bus-ring { transition: none !important; }
  /* 圆底章：和站牌 🚏 在视觉上彻底分开 —— 站是地图上的固定点，车是会动的东西，
     给它一个「载具徽章」的形态，扫一眼就知道哪个是哪个。 */
  .bus-dot {
    position: absolute; left: 2px; top: 2px;
    width: 26px; height: 26px; border-radius: 50%;
    background: #fff; border: 2px solid #8b1f41;
    box-shadow: 0 1px 5px rgba(0,0,0,.3);
    font-size: 14px; line-height: 22px; text-align: center;
    box-sizing: border-box;
  }
  /* 行进方向箭头。
     外圈整体旋转，箭头钉在环的正上方，于是转多少度箭头就绕到哪个方位；
     🚌 在另一个不旋转的层里，永远正立。
     过渡 .6s 而不是 1s：方向变化多在弯道，跟得太慢会指向刚走过的那段路。 */
  .bus-ring {
    position: absolute; left: 0; top: 0; width: 30px; height: 30px;
    transition: transform .6s linear; pointer-events: none;
  }
  /* 箭头做大并挑到徽章外面。
     原来 8×7px 且紧贴在圆环上沿，和 26px 的白底圆挤在一起，缩小一看就糊成
     一个点，方向根本读不出来（2026-08-17 用户反馈）。现在 14×11px 并整体
     上提到圆外，轮廓不再和圆底相撞。
     ⚠️ 溢出 30px 的 iconSize 是有意的 —— Leaflet 不裁剪 divIcon，而 iconAnchor
     仍是 (15,15)，即圆心，所以定位不受影响，只是箭头长在外面。 */
  .bus-ring > i {
    position: absolute; left: 50%; top: -9px; margin-left: -7px;
    width: 0; height: 0;
    border-left: 7px solid transparent;
    border-right: 7px solid transparent;
    border-bottom: 11px solid #8b1f41;
    filter: drop-shadow(0 1px 0 #fff) drop-shadow(0 -1px 0 #fff)
            drop-shadow(1px 0 0 #fff) drop-shadow(-1px 0 0 #fff);
  }
  .result-item .r-fuzzy {

  .result-header {

  .popup-btns button {
    border: 1px solid #8b1f41; background: #fff; color: #8b1f41; border-radius: 6px;
    padding: 4px 10px; margin-right: 6px; cursor: pointer; font-size: 12px;
  }
  .popup-btns button.primary { background: #8b1f41; color: #fff; }

  /* 常驻标签 */
  .bldg-label { background: none !important; border: none !important; }

  /* 建筑层伪立体：整张建筑画布挂柔和投影（GPU 合成，零逐楼开销） */
  .bldg-canvas { filter: drop-shadow(0 2px 2.5px rgba(70, 55, 45, 0.35)); }

  /* ===== 移动端适配 ===== */
  /* 触屏设备：触控目标加大（Apple HIG ≥44px 视触达面）；输入框 16px 防 iOS 聚焦自动放大 */
  @media (pointer: coarse) {
    #searchbox input { font-size: 16px; }
    #searchbox { padding: 10px 12px; }
    #langswitch button { padding: 8px 9px; font-size: 13px; }
    #chips button { padding: 9px 14px; font-size: 13px; }
    .popup-btns button { padding: 8px 14px; font-size: 13px; }
    .result-item { padding: 13px 14px; }
    #ctrl button { width: 46px; height: 46px; font-size: 19px; }
  }
  /* 手机窄屏：chips 横向滚动省一行；底部控件避开 Home 指示条；结果列表用动态视口高 */
  @media (max-width: 480px) {
    #topbar { top: calc(8px + env(safe-area-inset-top, 0px)); width: calc(100vw - 16px); }
    #chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none;
             -webkit-overflow-scrolling: touch; padding-bottom: 2px; }
    #chips::-webkit-scrollbar { display: none; }
    #chips button { flex: 0 0 auto; }
    #results { max-height: 48vh; }
    @supports (height: 1dvh) { #results { max-height: 48dvh; } }
    #routebar { bottom: calc(12px + env(safe-area-inset-bottom, 0px));
                max-width: calc(100vw - 16px); }
    #ctrl { right: 10px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }
    #legend { bottom: calc(88px + env(safe-area-inset-bottom, 0px)) !important;
              max-width: 40vw; }
    .leaflet-popup-content { font-size: 14px; }
  }
  /* 超小屏（<360px，老机型）：进一步收紧 */
  @media (max-width: 360px) {
    #searchbox { padding: 8px 10px; gap: 4px; }
    #langswitch button { padding: 8px 6px; }
  }
</style>
</head>

<!-- 数据加载态。小程序侧那层只盖到 HTML 文档到位；
     后面下校园数据的那几秒由这一层交代，Promise.all 落地后淡出。 -->
<div id="dataload">
  <div class="dl-grid">
    <div class="dl-b" style="width:34%;height:28px"></div>
    <div class="dl-b" style="width:22%;height:20px"></div>
    <div class="dl-b" style="width:46%;height:36px"></div>
    <div class="dl-b" style="width:28%;height:22px"></div>
    <div class="dl-b" style="width:40%;height:30px"></div>
    <div class="dl-b" style="width:30%;height:18px"></div>
  </div>
  <div class="dl-t">正在载入校园数据</div>
  <div class="dl-s">首次打开要下载一次，之后走缓存会快很多</div>
</div>

<div id="map"></div>

<div id="topbar">
  <div id="searchbox">
    <span>🔍</span>
    <input id="q" placeholder="搜索建筑 / 设施 / 教室…" autocomplete="off">
    <select id="langswitch"></select>
  </div>
  <div id="chips"></div>
  <div id="results"></div>
</div>

<div id="hover-label"></div>
<div id="routebar"></div>

<script>
'use strict';

/* ================= 基础地图 ================= */
/* 可平移范围。南边界从 33.582 放到 33.5795 ——
   SETTLE International（33.5834）与泊北口/国際村前 就在原边界南侧 150～320m 处，
   不放的话它们会被永远压在屏幕最下沿，等于看得见摸不着。
   ⚠️ 边界不是随便放的：再往南是 産の宮（33.5646），那一带既没有底图道路数据、
   也不是校园，放进来只会露出一片空白。150m 的余量刚好托住 SETTLE 这一片。 */
const CAMPUS_BOUNDS = L.latLngBounds([33.5795, 130.192], [33.618, 130.242]);
const map = L.map('map', {
  center: [33.600, 130.218], zoom: 16, minZoom: 15, maxZoom: 19,
  maxBounds: CAMPUS_BOUNDS, maxBoundsViscosity: 1.0,
  zoomControl: false, attributionControl: true,
  zoomSnap: 1,          // 整数缩放档：避免小数缩放用 CSS scale() 模拟导致矢量底图在真机上发虚模糊
  preferCanvas: false,  // web-view（含小程序）中 Canvas 支持不稳定，改用 SVG 渲染确保兼容
});
L.control.attribution({ prefix: false, position: 'bottomleft' })
  .addAttribution('© OpenStreetMap contributors').addTo(map);
// 离线底图：矢量道路/水体/绿地（在线版 tileLayer 已被本块替换）
function renderBasemap(data) {
  // 底图放进独立下层 pane，避免覆盖建筑 Canvas（建筑渲染器在顶层解析时已插入 overlayPane）
  if (!map.getPane('basemap')) {
    map.createPane('basemap');
    map.getPane('basemap').style.zIndex = 350; // 低于 overlayPane(400)，高于 tilePane(200)
  }
  if (!data) return;
  const styles = {
    water:  { color: '#9cbdd0', weight: 0.5, fillColor: '#c1d9e8', fillOpacity: 0.75 },
    greens: { color: '#aacc94', weight: 0.5, fillColor: '#dbe8d0', fillOpacity: 0.6 },
    roads: function(f) {
      var hw = f.properties.highway || '';
      var major = /motorway|trunk|primary|secondary|tertiary/.test(hw);
      var path = /footway|path|steps|cycleway|pedestrian/.test(hw);
      return path
        ? { color: '#b5ada4', weight: 1.5, dashArray: '3 4', fill: false, opacity: 0.9 }
        : major
          ? { color: '#a19990', weight: 4.5, fill: false, opacity: 0.95 }
          : { color: '#aaa299', weight: 2.5, fill: false, opacity: 0.9 };
    }
  };
  ['water', 'greens', 'roads'].forEach(function(layer) {
    var feats = data.features.filter(function(f) { return f.properties._layer === layer; });
    if (!feats.length) return;
    // data-basemap 用 {lat,lon} 点数组存储几何，转成标准 GeoJSON 再交给 L.geoJSON
    var geojson = {
      type: 'FeatureCollection',
      features: feats.map(function(f) {
        var pts = f.geometry.map(function(p) { return [p.lon, p.lat]; });
        var geom = (layer === 'roads')
          ? { type: 'LineString', coordinates: pts }
          : { type: 'Polygon', coordinates: [pts] };
        return { type: 'Feature', properties: f.properties, geometry: geom };
      })
    };
    L.geoJSON(geojson, {
      style: typeof styles[layer] === 'function' ? styles[layer] : function() { return styles[layer]; },
      interactive: false,
      pane: 'basemap'
    }).addTo(map);
  });
}
map.fitBounds(CAMPUS_BOUNDS);

// 数据文件的缓存版本号。

// 就踩在这个坑上。这里把 v 透传下去，让版本号对数据文件也真正起作用。
const DATA_V = (function () {
  try { return new URLSearchParams(location.search).get('v') || ''; }
  catch (e) { return ''; }
})();

function loadData(name) {
  const el = document.getElementById('data-' + name);
  if (el) return Promise.resolve(JSON.parse(el.textContent));  // 离线版：内嵌，不涉及缓存
  const url = 'data/' + name + '.' + (DATA_EXT[name] || 'json') + (DATA_V ? '?v=' + encodeURIComponent(DATA_V) : '');
  return fetch(url).then(r => r.json());
}

       ?q=<关键词>              只把搜索框填好、列出结果（搜索页跳过来用）

     而不是一片空白让人以为跳失败了。 */
  try {
    const params = new URLSearchParams(location.search);
    const fp = (params.get('focus') || '').trim();
    const qp = params.get('q');
    let done = false;
    if (fp) {
      const b = buildings.find(f => String(f.properties.id) === fp);
      if (b) {
        gotoResult({ kind: 'building', obj: b });
        done = true;
      } else {
        const exact = searchAll(fp).filter(r => !r.fuzzy);
        if (exact.length === 1) { gotoResult(exact[0]); done = true; }
      }
    }
    if (!done) {
      const term = qp || fp;
      const qEl = term && document.getElementById('q');
      if (qEl) { qEl.value = term; qEl.dispatchEvent(new Event('input')); }
    }
  } catch (e) {}
});
});

/** 默认视角：敷地面积加权形心为中心，缩放至全校园恰好充满画面 */
function fitCampusView() {
  if (!campusBoundary) return;
  const polys = campusBoundary.geometry.type === 'MultiPolygon'
    ? campusBoundary.geometry.coordinates.map(c => c[0])
    : [campusBoundary.geometry.coordinates[0]];
  // 面积加权形心（鞋带公式，逐环累加）
  let A = 0, CX = 0, CY = 0;
  const bounds = L.latLngBounds([]);
  for (const ring of polys) {
    let a = 0, cx = 0, cy = 0;
    for (let i = 0; i < ring.length - 1; i++) {
      const [x0, y0] = ring[i], [x1, y1] = ring[i + 1];
      const cr = x0 * y1 - x1 * y0;
      a += cr; cx += (x0 + x1) * cr; cy += (y0 + y1) * cr;
      bounds.extend([y0, x0]);
    }
    if (Math.abs(a) > 1e-12) {
      const w = Math.abs(a) / 2;
      A += w; CX += (cx / (3 * a)) * w; CY += (cy / (3 * a)) * w;
    }
  }
  const centroid = L.latLng(CY / A, CX / A);
  // 数值直接求解全览缩放（fitBounds 的 zoomSnap 取整 + maxBounds 钳制会互相干扰，弃用）
  const size = map.getSize();
  if (size.x < 50 || size.y < 50) return;   // 容器尺寸未定型，等 resize/延迟重校
  const REF = 15;
  const p1 = map.project(bounds.getNorthWest(), REF);
  const p2 = map.project(bounds.getSouthEast(), REF);
  const w = Math.abs(p2.x - p1.x), h = Math.abs(p2.y - p1.y);
  const scale = Math.min((size.x - 24) / w, (size.y - 24) / h) * 0.8;
  let z = REF + Math.log2(scale);
  z = Math.floor(z);                        // 保守向下取整到整数档 → 保证全境可见（同时消除分数缩放模糊）
  map.setMaxBounds(null);                   // 先解除旧钳制，setView 不被拉扯
  map.setMinZoom(z);                        // 全览视角即缩放下限：不能缩得更小
  map.setView(centroid, z, { animate: false });
  map.setMaxBounds(map.getBounds().pad(0.05));  // 平移范围 = 全览画面 ±5%
}
// 浏览器面板/窗口在页面加载后才定型尺寸 → 视口变化时重校一次默认视角；
// 用户一旦开始拖动/缩放就不再打扰
let autoFitActive = true;
map.on('dragstart', () => { autoFitActive = false; });
document.getElementById('map').addEventListener('wheel', () => { autoFitActive = false; }, { passive: true, once: true });
map.on('resize', () => { if (autoFitActive && campusBoundary) fitCampusView(); });
// 一次性延迟重校：兜底"容器尺寸晚于数据就绪"的宿主环境（内嵌 webview 等）
setTimeout(() => { if (autoFitActive && campusBoundary) { map.invalidateSize(); fitCampusView(); } }, 800);
// web-view 中容器尺寸偶尔更晚才稳定，再补一次固定初始视角
setTimeout(() => { if (autoFitActive && campusBoundary) { map.invalidateSize(); fitCampusView(); } }, 1600);

/* ===== §1 校地边界 + 遮罩 + 校外判定 ===== */
function renderBoundary() {
  if (!campusBoundary) return;
  const geom = campusBoundary.geometry;
  L.geoJSON(geom, {
    style: { color: '#8b1f41', weight: 2, dashArray: '6 6', fill: false, opacity: 0.5 },
    interactive: false
  }).addTo(map);
  // 校外遮罩：世界矩形为外环 + 校地各环为洞（Leaflet 多环 polygon = 带洞填充）
  // [R-UI1 修复] 原实现画了不带洞的全球面 → 全图（含校内）一起蒙灰
  const world = [[-90, -180], [90, -180], [90, 180], [-90, 180]];
  const holeRings = (geom.type === 'Polygon' ? [geom.coordinates[0]]
    : geom.type === 'MultiPolygon' ? geom.coordinates.map(c => c[0]) : [])
    .map(ring => ring.map(([lng, lat]) => [lat, lng]));   // GeoJSON lon,lat → Leaflet lat,lng
  L.polygon([world, ...holeRings], {
    fillColor: '#f8f6f2', fillOpacity: 0.55, stroke: false, interactive: false
  }).addTo(map);
}

let offCampus = new Set();
function markOffCampus() {
  if (!campusBoundary) return;
  // Use turf-like point-in-polygon on centroids
  const poly = campusBoundary.geometry;
  buildings.forEach(f => {
    const c = centroidOf(f);
    if (!pointInPolygon(c, poly)) offCampus.add(f.properties.id);
  });
}
function pointInPolygon(pt, geom) {
  const [x, y] = pt;
  const rings = geom.type === 'Polygon' ? [geom.coordinates[0]]
    : geom.type === 'MultiPolygon' ? geom.coordinates.map(c => c[0]) : [];
  for (const ring of rings) {
    let inside = false;
    for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
      const [xi, yi] = ring[i], [xj, yj] = ring[j];
      if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
    }
    if (inside) return true;
  }
  return false;
}

/* 名称解析：标注（按语言，含回退链）→ OSM 原名 */
function nameOf(f) {
  const a = annotations[f.properties.id];
  if (a) {
    const chain = I18N[lang].nameFallback.map(k => a[k]);
    const hit = chain.find(x => x);
    if (hit) return hit;
  }
  return f.properties.name || '';
}
function poiName(p) {
  const chain = I18N[lang].nameFallback.map(k => p[k]);
  return chain.find(x => x) || '';
}

/* ================= §2 建筑分色渲染 ================= */
function styleOf(f) {
  const id = f.properties.id;
  const named = !!nameOf(f);
  if (!named) return { color: '#c5c0b8', weight: 0.5, fillColor: '#e2dfda', fillOpacity: 0.28, opacity: 0.45 };
  if (offCampus.has(id)) return { color: '#c0bab2', weight: 0.4, fillColor: '#e0dcd6', fillOpacity: 0.22, opacity: 0.4 };
  const cat = (annotations[id] && annotations[id].cat) || 'other';
  const c = CAT_COLORS[cat] || CAT_COLORS.other;
  return { color: c, weight: 1.2, fillColor: c, fillOpacity: 0.4, opacity: 0.85 };
}

// 建筑层专用 Canvas 渲染器：整层挂 CSS drop-shadow → 每栋楼获得柔和投影（伪立体），
// 且不影响底图/路线/遮罩所在的默认画布
const buildingRenderer = L.canvas();

// 选中柔光晕：类别色粗描边低透明度，替代刺眼的红圈
let selectedHalo = null;
function clearHalo() {
  if (selectedHalo) { map.removeLayer(selectedHalo); selectedHalo = null; }
}
map.on('popupclose', clearHalo);
function showHalo(layer, feature) {
  clearHalo();
  const base = styleOf(feature);
  selectedHalo = L.polygon(layer.getLatLngs(), {
    renderer: buildingRenderer, interactive: false,
    color: base.color, weight: 10, opacity: 0.22, fill: false,
  }).addTo(map);
}

function renderBuildings() {
  if (buildingLayer) map.removeLayer(buildingLayer);
  buildingLayer = L.geoJSON({ type: 'FeatureCollection', features: buildings }, {
    style: styleOf,
    renderer: buildingRenderer,
    onEachFeature: (feature, layer) => {
      const id = feature.properties.id;
      const n = nameOf(feature);
      layer.on('mouseover', e => {
        if (!n || offCampus.has(id)) return;
        // 温和悬浮：保持类别色，填充变实 + 描边略加粗（不变红）
        const base = styleOf(feature);
        layer.setStyle({ weight: 2, opacity: 1,
                         fillOpacity: Math.min(0.7, (base.fillOpacity || 0.4) + 0.25) });
        if (layer.bringToFront) layer.bringToFront();
        hoverLabel.textContent = n;
        hoverLabel.style.display = 'block';
      });
      layer.on('mousemove', e => {
        hoverLabel.style.left = e.originalEvent.clientX + 'px';
        hoverLabel.style.top = e.originalEvent.clientY + 'px';
      });
      layer.on('mouseout', () => {
        layer.setStyle(styleOf(feature));
        hoverLabel.style.display = 'none';
      });
      layer.on('click', e => {
        if (!n) return;
        if (!offCampus.has(id)) showHalo(layer, feature);
        openFeaturePopup(e.latlng, n, id, null);
      });
    }
  }).addTo(map);
  // 给建筑画布挂投影样式（渲染器容器在首次 addTo 后才存在）
  if (buildingRenderer._container) buildingRenderer._container.classList.add('bldg-canvas');
  updateLabels();
}

/* ===== §3 常驻标签 ===== */
const TIER1_IDS = new Set();  // filled after annotations load
function updateLabels() {
  if (labelLayer) map.removeLayer(labelLayer);
  const z = map.getZoom();
  if (z < 16) { labelLayer = null; return; }
  const items = [];
  buildings.forEach(f => {
    const n = nameOf(f);
    if (!n || offCampus.has(f.properties.id)) return;
    const ann = annotations[f.properties.id];
    const tier = ann && ann.tier;
    if (z < 17.5 && tier !== 1) return;
    const [lon, lat] = centroidOf(f);
    const label = n.length > 12 ? n.substring(0, 12) + '…' : n;
    items.push(L.marker([lat, lon], {
      icon: L.divIcon({
        className: 'bldg-label',
        html: `<span style="font-size:11px;color:#3a3a3a;text-shadow:0 0 2px #fff,0 0 2px #fff,0 0 2px #fff,0 0 2px #fff;white-space:nowrap;pointer-events:none">${label}</span>`,
        iconSize: [0,0], iconAnchor: [0,0]
      }),
      interactive: false
    }));
  });
  labelLayer = L.layerGroup(items).addTo(map);
}
map.on('zoomend', () => { if (buildingLayer) updateLabels(); });

/* ===== 图例 ===== */
let legendVisible = window.innerWidth > 480;   // 手机默认折叠，桌面默认展开
function renderLegend() {
  const prev = document.getElementById('legend');
  if (prev) prev.remove();
  const cats = Object.keys(CAT_COLORS).filter(c => c !== 'other');
  const title = { zh: '图例', ja: '凡例', en: 'Legend' }[lang];
  const rows = cats.map(c => {
    const nm = (I18N[lang].cat && I18N[lang].cat[c]) || c;
    return `<div style="display:flex;align-items:center;gap:6px" data-cat="${c}">
      <span style="width:14px;height:14px;border-radius:3px;background:${CAT_COLORS[c]}"></span>
      <span style="font-size:12px">${nm}</span></div>`;
  }).join('');
  const legend = document.createElement('div');
  legend.id = 'legend';
  const titleDiv = document.createElement('div');

  titleDiv.textContent = T('legend');
  legend.appendChild(titleDiv);

legend.innerHTML = `<div style="font-size:12px;color:#888;display:flex;align-items:center;gap:5px">
      <span>◧</span><span>${title}</span><span id="legend-arrow" style="font-size:10px">${legendVisible ? '▾' : '▸'}</span></div>
    <div id="legend-body" style="display:${legendVisible ? 'block' : 'none'}">${rows}</div>`;
  legend.style.cssText = 'position:fixed;right:12px;bottom:24px;z-index:1100;background:rgba(255,255,255,0.93);border-radius:10px;padding:8px 12px;box-shadow:0 2px 12px rgba(0,0,0,0.12);line-height:1.9;cursor:pointer;user-select:none';
  legend.addEventListener('click', () => {
    legendVisible = !legendVisible;
    legend.querySelector('#legend-body').style.display = legendVisible ? 'block' : 'none';
    legend.querySelector('#legend-arrow').textContent = legendVisible ? '▾' : '▸';

const POI_ICON = { sports: '⚽', farm: '🌾', nature: '🌳', plaza: '🏛️', dorm: '🏠' };
// POI（运动场/农场等非建筑设施）：emoji 标记替代旧蓝色圆点——
// 旧圆点与教学楼类别蓝、GPS 定位点三蓝撞色；且运动场是"面"，底图绿地已可见，
// 常驻圆点是噪音。现仅 zoom>=16 显示，全景视图保持干净。
const POI_MIN_ZOOM = 16;
function renderPois() {
  if (poiLayer) { map.removeLayer(poiLayer); poiLayer = null; }
  if (map.getZoom() < POI_MIN_ZOOM) return;
  poiLayer = L.layerGroup(pois.map(p => {
    const m = L.marker([p.lat, p.lon], {
      icon: L.divIcon({ className: '', iconSize: [20, 20], iconAnchor: [10, 10],
        html: `<div style="font-size:15px;line-height:20px;text-align:center;` +
              `text-shadow:0 0 3px #fff,0 0 3px #fff">${POI_ICON[p.type] || '📌'}</div>` }),
      interactive: true, keyboard: false,
    });
    m.on('click', e => openFeaturePopup(e.latlng, (POI_ICON[p.type] || '📌') + ' ' + poiName(p), null, [p.lon, p.lat]));
    return m;
  })).addTo(map);
}
map.on('zoomend', () => {
  const want = map.getZoom() >= POI_MIN_ZOOM;
  if (want !== !!poiLayer) renderPois();
});

/* ================= 设施类别：快捷片 + 图层 + 意图查询 ================= */
function distM(lon1, lat1, lon2, lat2) {
  return Math.hypot((lon1 - lon2) * MLON, (lat1 - lat2) * MLAT);
}
function facName(f) {
  if (lang === 'en' && f.name_en) return f.name_en;
  // name 为空时回退到 name_en。官方图提取出来的那批点（AED / 校门）只有 name_en，
  // 里面装的正是「在哪栋楼」「哪个门」—— 不回退的话，中文和日文用户看到的是
  // 40 个一模一样的「🫀 AED」，而所属建筑恰恰是 AED 唯一有用的信息。
  // 楼名本身多为英文/罗马字，直接显示比显示空白强得多。
  return f.name || f.name_en || '';
}
/** 一个类别的全部条目：设施点 + 名称匹配的已标注建筑，按距地图中心排序 */
function catItems(key) {
  const cat = CATS[key];
  const c = map.getCenter();
  const items = [];
  for (const f of facilities) {
    if (cat.types.includes(f.type))
      items.push({ kind: 'facility', cat: key, obj: f, d: distM(f.lon, f.lat, c.lng, c.lat) });
  }
  if (cat.nameRe) {
    for (const b of buildings) {
      const a = annotations[b.properties.id];
      const hay = [a && a.name_zh, a && a.name_ja, a && a.name_en, b.properties.name]
        .filter(Boolean).join('\n');
      if (cat.nameRe.test(hay)) {
        const cc = centroidOf(b);
        items.push({ kind: 'building', cat: key, obj: b, d: distM(cc[0], cc[1], c.lng, c.lat) });
      }
    }
  }
  return items.sort((x, y) => x.d - y.d);
}
/** 激活类别：地图上铺设施标记 */
function setCategory(key) {
  if (facilityLayer) { map.removeLayer(facilityLayer); facilityLayer = null; }
  activeCat = key;
  document.querySelectorAll('#chips button').forEach(b =>
    b.classList.toggle('active', b.dataset.cat === activeCat));
  if (!activeCat) return;
  const cat = CATS[activeCat];
  facilityLayer = L.layerGroup(
    facilities.filter(f => cat.types.includes(f.type)).map(f => {
      const m = L.marker([f.lat, f.lon], {
        icon: L.divIcon({ className: '', html:
          `<div style="font-size:20px;text-shadow:0 1px 3px rgba(0,0,0,.35)">${cat.icon}</div>`,
          iconSize: [22, 22], iconAnchor: [11, 11] })
      });
      m.on('click', e => {
        // 巴士站走专用弹窗（今日到达时刻 + 下一班），其余类别沿用通用弹窗
        if (key === 'bus') return openBusStopPopup(e.latlng, f);
        openFeaturePopup(e.latlng,
          `${cat.icon} ${facName(f) || I18N[lang].chip[key]}`, null, [f.lon, f.lat]);
      });
      return m;
    })).addTo(map);
}
function clearCategory() {
  if (facilityLayer) { map.removeLayer(facilityLayer); facilityLayer = null; }
  activeCat = null;
  document.querySelectorAll('#chips button').forEach(b => b.classList.remove('active'));
  resultsDiv.style.display = 'none';
}
function renderChips() {
  // chipHidden 的类别不进片栏，但仍可被搜索命中（detectIntent → setCategory）
  $('chips').innerHTML = Object.entries(CATS).filter(([, c]) => !c.chipHidden).map(([k, c]) =>
    `<button data-cat="${k}">${c.icon} ${((I18N[lang].chip || I18N.en.chip)[k])}</button>`).join('');
  document.querySelectorAll('#chips button').forEach(b => {
    b.addEventListener('click', () => {
      const key = b.dataset.cat;
      if (activeCat === key) {
        // 同一类别再次点击：列表正显示 -> 第三次点击消除；否则 -> 第二次点击出列表
        if (resultsDiv.style.display === 'block') {
          clearCategory();            // 第三次：取消选中 + 收起列表
        } else {
          showCatResults(key);        // 第二次：弹出列表
        }
      } else {
        setCategory(key);             // 第一次：选中并铺设施标记
        resultsDiv.style.display = 'none';
      }
    });
  });
}
/** 类别结果列表（意图查询与点片共用） */
function showCatResults(key) {
  const items = catItems(key).slice(0, 20);
  const cat = CATS[key];
  resultsDiv.style.display = items.length ? 'block' : 'none';
  const chipName = (I18N[lang].chip || I18N.en.chip)[key];
  resultsDiv.innerHTML = `<div class="result-header">
    <span>${cat.icon} ${chipName}</span>
    <button class="close-results" title="${I18N[lang].clear}">×</button>
  </div>` + items.map((it, i) => {
    const nm = it.kind === 'facility'
      ? (facName(it.obj) || chipName)
      : nameOf(it.obj);
    return `<div class="result-item" data-i="${i}">
      <div class="r-name">${cat.icon} ${nm}</div>
      <div class="r-sub">${Math.round(it.d)} m</div></div>`;
  }).join('');
  resultsDiv.querySelector('.close-results').addEventListener('click', clearCategory);
  resultsDiv.querySelectorAll('.result-item').forEach(el => {
    el.addEventListener('click', () => {
      const it = items[+el.dataset.i];
      if (it.kind === 'facility') {
        const ll = [it.obj.lat, it.obj.lon];
        map.setView(ll, 18);
        // 与地图上直接点巴士站保持一致：列表里点进来也给时刻表
        if (key === 'bus') openBusStopPopup(L.latLng(ll), it.obj);
        else openFeaturePopup(L.latLng(ll), `${cat.icon} ${facName(it.obj) || chipName}`,
          null, [it.obj.lon, it.obj.lat]);
      } else {
        gotoResult({ kind: 'building', obj: it.obj });
      }
      resultsDiv.style.display = 'none';
    });
  });
}
/* 设施 type → 分类 key 的反查（CATS 里存的是正查 types）。
   给搜索结果配图标和类别名用：搜到「ローソン」要能标出它是便利店。
   一个 type 理论上可以落进多个分类，取第一个命中的即可 —— 这只是给人看的提示，
   不参与任何筛选逻辑。表建一次缓存起来，别每条结果都重扫 CATS。 */
let _typeCat = null;
function catOfType(t) {
  if (!_typeCat) {
    _typeCat = {};
    for (const [k, c] of Object.entries(CATS))
      for (const ty of (c.types || [])) if (!(ty in _typeCat)) _typeCat[ty] = k;
  }
  return _typeCat[t] || null;
}

/** 意图识别："食堂在哪里" → 类别 key；无命中返回 null */
function detectIntent(q) {
  const s = q.trim().toLowerCase().replace(WHERE_RE, '').replace(/[？?！!。 ]/g, '');
  if (!s) return null;
  for (const [k, c] of Object.entries(CATS)) {
    if (c.syn.some(w => s === w || (s.length >= 2 && (s.includes(w) || w.includes(s)) && w.length >= 2)))
      return k;
  }
  return null;
}

/* ================= 弹窗（含导航按钮） ================= */
/* ================= §4 弹窗信息卡 ================= */
function openFeaturePopup(latlng, title, osmId, lonlat) {
  const pt = lonlat || [latlng.lng, latlng.lat];
  const ann = annotations[osmId] || {};
  const cat = ann.cat || 'other';
  const catName = I18N[lang].cat[cat] || cat;
  const catColor = CAT_COLORS[cat] || CAT_COLORS.other;
  const secondName = lang === 'zh' ? (ann.name_ja || ann.name_en)
    : lang === 'ja' ? (ann.name_en || ann.name_zh)
    : (ann.name_ja || ann.name_zh);

  // 教室列表
  let roomHtml = '';
  const buildingRooms = classrooms.filter(c => c.building === Number(osmId));
  if (buildingRooms.length) {
    roomHtml = `<div style="margin:4px 0;font-size:12px;color:#666">🚪 ${buildingRooms.length} 间教室 ▸</div>`;
  }

  /* 最近的 AED —— 只在【已经在找 AED】时才出现。
     这张图的日常用途是找食堂、便利店、厕所、巴士，每点一栋楼都跳一行急救信息
     是一种持续的噪音；而真出事的时候，人会去搜「AED」，那时 activeCat 就是 aed，
     这一行会出现在他点开的每一栋楼上。

     只在 300m 以内显示 —— 再远在急救场景下没有行动意义。
     ⚠️ 坐标是所属建筑的质心，所以这句话的含义是「哪栋楼里有」，
     不是「在几楼哪面墙」，文案里因此只给楼名不给「就在这儿」的暗示。 */
  let aedHtml = '';
  const aeds = activeCat === 'aed' ? facilities.filter(f => f.type === 'aed') : [];
  if (aeds.length) {
    let best = null, bestD = Infinity;
    for (const a of aeds) {
      const d = distM(a.lon, a.lat, pt[0], pt[1]);
      if (d < bestD) { bestD = d; best = a; }
    }
    if (best && bestD <= 300) {
      const where = facName(best);
      aedHtml = `<div style="margin:4px 0;font-size:12px;color:#c0392b">🫀 ${T('nearAed')}：`
              + `${where ? where + ' · ' : ''}${Math.round(bestD)} m</div>`;
    }
  }

  const offlineTag = offCampus.has(osmId) ? ' <span style="font-size:10px;color:#999">校外</span>' : '';
  const html = `
    <div><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${catColor};margin-right:4px"></span><span class="popup-name">${title}${offlineTag}</span></div>
    ${secondName ? `<div class="popup-sub">${ann.num ? '#' + ann.num + ' · ' : ''}${secondName} <span style="background:${catColor}22;color:${catColor};padding:0 5px;border-radius:3px;font-size:10px">${catName}</span></div>` : ''}
    ${roomHtml}
    ${aedHtml}
    <div class="popup-btns" style="margin-top:6px">
      <button onclick="setRoute('from', ${pt[0]}, ${pt[1]})">${T('from')}</button>
      <button class="primary" onclick="setRoute('to', ${pt[0]}, ${pt[1]})">${T('to')}</button>
    </div>`;
  L.popup().setLatLng(latlng).setContent(html).openOn(map);
}

/* ================= 昭和バス：时刻表 + 示意动画 =================
 *
 * 数据：bus-schedule.json（3 线路 × 三日型 × 226 班，从「九大学研都市駅」的発車時刻）
 *      bus-routes.json（各线代表班次的站序 + 相对发车分钟 offset + 校内站坐标）
 *      jp-holidays.json（内阁府法定祝日 2025-2027）
 *
 * ⚠️ 两条必须守住的诚实边界：
 *  1. 这不是实时 GPS。位置是「按时刻表推算」出来的，车堵在路上我们不知道。
 *     所以有车在屏幕上时必须挂 BUS_NOTE 那个角标，不能让人以为在看实时定位。
 *  2. 手上只有【去程】（駅 → 九大）。facilities 里每个站名都是两个点
 *     （马路对向的两根站牌），而记录里没有方向字段，无法区分哪根是回程。
 *     所以站点弹窗只敢说「到着」，并明写回程未收录 —— 在回程站牌上显示去程时刻，
 *     等于给一个想回车站的人一个错的时间，比不显示更糟。
 *     回程要等 build_bus_schedule.py 用校内站 nodeId + updown=1 抓到之后再说。
 */
const BUS_ANIM = true;        // 动画总开关。真机 web-view 里若表现不好，改 false 即可，

/** 东京时间的 {iso, 当日分钟数, 星期}。
    留学生可能人在别的时区打开这张图，一律按东京算，否则日型和倒计时全错。 */
function tokyoNow() {
  try {
    const p = {};
    for (const x of new Intl.DateTimeFormat('en-CA', {
      timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false,
    }).formatToParts(new Date())) if (x.type !== 'literal') p[x.type] = x.value;
    const iso = `${p.year}-${p.month}-${p.day}`;
    return { iso,
             // hour12:false 在部分引擎上午夜会给出 "24"，取模压回 0
             // min 带小数：秒也算进去。只给整数分钟的话，动画每分钟才动一次，
             // 无论渲染多频繁都是「跳格」—— 时间分辨率决定动画分辨率。
             min: (Number(p.hour) % 24) * 60 + Number(p.minute) + Number(p.second || 0) / 60,
             wd: new Date(iso + 'T00:00:00Z').getUTCDay() };
  } catch (e) {
    const d = new Date();   // Intl 不可用时退回本机时区，聊胜于无
    const iso = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    return { iso, min: d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60, wd: d.getDay() };
  }
}

/* お盆：8/13–8/15。昭和バス在自家时刻表页上明写
   「2026年8月13日(木)～2026年8月15日(土)は日祝ダイヤで運行します」。
   不处理的话，落在平日的 8/13、8/14 会按平日表算 —— 而那正是学生集中出行的两天。
   ⚠️ 这条是从 2026 年的公告推广到每年的（お盆 日期在现行历法下固定）。
   年末年始同样有临时改正，但昭和バス的具体日期我没有核到，就不猜 ——
   宁可那几天照常显示平日表，也不写一个编出来的区间。 */
function busIsObon(iso) {
  const md = iso.slice(5);
  return md >= '08-13' && md <= '08-15';
}

/** 日型。祝日与お盆优先 —— 山の日这类落在平日的节日照样走日祝ダイヤ，
    只看星期会把当天的班次全部算错。 */
function busDayType(t) {
  if (busIsObon(t.iso)) return 'holiday';
  if (busHolidaySet && busHolidaySet.has(t.iso)) return 'holiday';
  return t.wd === 0 ? 'holiday' : (t.wd === 6 ? 'saturday' : 'weekday');
}

function busInit(sch, rts, hol) {
  if (!sch || !rts || !rts.routes) return;   // 数据缺一不可，缺了就整体不启用
  busSchedule = sch; busRoutes = rts;
  const list = hol && (hol.holidays || hol);
  if (Array.isArray(list) && list.length) {
    busHolidaySet = new Set(list);
    busHolidayLast = list[list.length - 1];
  }
  for (const rid in rts.routes)
    for (const s of rts.routes[rid].stops) {
      if (s.lat != null) busStopNames.add(s.name);
      // 折线的累计长度预算一次，之后每帧只做查表。
      // 放在这里而不是每帧算：8 辆车 × 每秒一帧 × 每次遍历十几个折点，
      // 白白烧手机电，而这个结果是恒定的。
      if (Array.isArray(s.path) && s.path.length > 1) {
        const cum = [0];
        for (let i = 0; i < s.path.length - 1; i++) {
          const p = s.path[i], q = s.path[i + 1];
          cum.push(cum[i] + Math.hypot((q[0] - p[0]) * MLON, (q[1] - p[1]) * MLAT));
        }
        s._cum = cum;
      }
    }
  if (BUS_ANIM) {
    busRender();
    busTimer = setInterval(busRender, BUS_TICK_MS);
    /* 视野一动就冻住过渡，动完再解冻。
       Leaflet 用 transform 定位 marker，而我们又拿 transform 做「沿路前进」的
       补间 —— 同一个通道，浏览器分不出哪次是重定位哪次是行驶，于是把重定位
       也播成一秒的滑行：行内 style 已是新坐标，屏幕上却还在旧位置。
       实测缩放两级后偏差 238px（2026-08-17 用户报的「车飘出道路」）。

       ⚠️ 三个点缺一不可，早先那版只做了第一个所以没修好：
         ① 必须连【平移】一起冻。移动同样会重算每个 marker 的 transform，
            只挂 zoomstart/zoomend 的话拖动地图照样飘。
         ② 解冻前必须【强制回流】。不回流的话，「改回有过渡」和「新坐标」
            会被浏览器合成同一批样式计算，照样触发动画。
         ③ 冻结用 class 加在容器上，不要逐个改 el.style.transition ——
            marker 是复用池里动态增删的，逐个改会漏掉冻结期间新建的那些。 */
    const busFreeze = () => map.getContainer().classList.add('bus-frozen');
    const busThaw = () => {
      const c = map.getContainer();
      busRender();                                    // 先按新视野把车摆好
      busMarkers.forEach(m => m.update());            // 逼 Leaflet 落实新像素位
      void c.offsetWidth;                             // ② 强制回流
      c.classList.remove('bus-frozen');
    };
    map.on('movestart zoomstart', busFreeze);
    map.on('moveend zoomend', busThaw);               // 取代原来的 moveend→busRender
  }
}

/* 沿折线按【距离比例】取点。
   不能按折点序号取 —— 折点疏密极不均匀（直路上两点隔一百多米，弯道上隔几米），
   按序号会让车在弯道爬行、在直路上瞬移。
   累计长度在 busInit 里预算好挂到 stop._cum，这里只做查表。 */
function alongPath(pts, cum, k) {
  const total = cum[cum.length - 1];
  if (!(total > 0)) return [pts[0][1], pts[0][0]];
  const want = total * Math.max(0, Math.min(1, k));
  let i = 0;
  while (i < cum.length - 1 && cum[i + 1] < want) i++;
  const segLen = cum[i + 1] - cum[i];
  const f = segLen > 0 ? (want - cum[i]) / segLen : 0;
  const lon = pts[i][0] + (pts[i + 1][0] - pts[i][0]) * f;
  const lat = pts[i][1] + (pts[i + 1][1] - pts[i][1]) * f;
  return [lat, lon];
}

/** 某线某班在 t 分钟时的位置；不在校内有坐标的区间上则返回 null（不画）。 */
function busInterpolate(stops, t) {
  for (let i = 0; i < stops.length - 1; i++) {
    const a = stops[i], b = stops[i + 1];
    if (t < a.offset || t > b.offset) continue;
    if (a.lat == null && b.lat == null) return null;          // 校外段：车还没进地图
    if (a.lat == null) return t >= b.offset ? [b.lat, b.lon] : null;
    if (b.lat == null) return t <= a.offset ? [a.lat, a.lon] : null;
    const span = b.offset - a.offset;
    // ⚠️ 相邻两站 offset 可能相同 —— 抓取时分钟取整所致，三条线的
    // 「産学連携交流センター → 西消防署元岡出張所前」都是这种零区间。
    // 直接按比例算就是 0/0 = NaN，marker 会消失或抛错。落到后一站即可。
    const k = span > 0 ? (t - a.offset) / span : 1;
    // 有车行道折线就沿路走。没有（校外段、或建路径时被判定异常的段）退回直线。
    // 直线是巴士穿过建筑物的原因：站点在路边，但两站之间的直线不是路。
    if (a._cum) return alongPath(a.path, a._cum, k);
    return [a.lat + (b.lat - a.lat) * k, a.lon + (b.lon - a.lon) * k];
  }
  return null;
}

function busLineOf(id) {
  return (busSchedule.lines || []).find(l => l.id === id) || null;
}
function busLineName(line) {
  if (!line) return '';
  return lang === 'zh' ? (line.name_zh || line.name_ja)
       : lang === 'ja' ? line.name_ja
       : (line.name_en || line.name_ja);
}
/* 该班次开往哪儿。
   ⚠️ 不要再用一句写死的「駅 → 九大 方向」—— 现在两个方向的车都在图上跑，
   写死的那句会让一半的车带着相反的说明。数据里每条「线路-方向」自带 direction_zh。 */
function busLineDir(line) {
  if (!line) return '';
  return (lang === 'zh' ? line.direction_zh : line.direction) || line.direction || '';
}
/* 只要终点站名，不要整句。
   direction_zh 是「往 前原駅北口（出校园）」这种完整说法，适合车辆弹窗；
   站点弹窗要在一行里并列三个终点，得先剥掉「往」和括号里的补充。 */
function busLineDest(line) {
  const d = busLineDir(line).replace(/^往\s*/, '')
    .replace(/[（(][^）)]*[）)]\s*$/, '').trim();
  /* 校内方向的 direction 写的是笼统的「九大」，在一个本来就叫「九大◯◯」的
     站上显示「开往 九大」等于没说。这时退回线路真正的终点站
     （总合グラウンド / 伊都営業所 / 東ゲート）—— line.id 就是 routes 的键。 */
  if ((d === '九大' || d === '九大キャンパス' || /^Kyudai$/i.test(d)) && busRoutes && line.id) {
    const st = busRoutes.routes[line.id] && busRoutes.routes[line.id].stops;
    if (st && st.length) return st[st.length - 1].name;
  }
  return d;
}
/** 把 {"07":[37,48]} 摊平成发车分钟数组 */
function busDepartures(line, dayType) {
  const tbl = (line.depart_from_station || {})[dayType] || {};
  const out = [];
  for (const hh in tbl) for (const mm of tbl[hh]) out.push(Number(hh) * 60 + mm);
  return out.sort((a, b) => a - b);
}
// 分钟数 → HH:MM。必须能吃负数与 >1440：跨午夜的班次在「今天的时间轴」上
// 発車时刻是负的（-8 表示昨天 23:52），到达时刻可能超过 1440。
const busHHMM = (m) => {
  const h = ((Math.floor(m / 60) % 24) + 24) % 24, mi = ((m % 60) + 60) % 60;
  return `${String(h).padStart(2, '0')}:${String(mi).padStart(2, '0')}`;
};

/** 前一天的 {iso, wd}，用于跨午夜班次 */
function busPrevDay(t) {
  const d = new Date(t.iso + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() - 1);
  return { iso: d.toISOString().slice(0, 10), wd: d.getUTCDay(), min: 0 };
}

/* 要看两张表，不是一张。
   shusenji 平日末班 23:52 発，到九大工学部是次日 00:11 —— 只算「今天」的时刻表，
   这辆车在 00:00 那一刻会从地图上凭空消失，而站点弹窗会对着正在等末班的人说
   「今日已无班次」。shift = -1440 把昨天的発車时刻折算到今天的时间轴上（可为负）。 */
function busFrames() {
  const t = tokyoNow();
  return [
    { dayType: busDayType(t), shift: 0 },
    { dayType: busDayType(busPrevDay(t)), shift: -1440 },
  ];
}

/* 行进方向（0=正北，顺时针度数）。
   取当前位置与稍后位置的方位角 —— 沿折线走的时候，方向随弯道实时变化，
   拿两站连线的方向是不对的（车在弯道上明明朝西，箭头却指着两站之间的东南）。

   高峰时段屏幕上会有三四辆车，光看图标分不出谁往校内开、谁往総合グラウンド开，
   这个箭头就是给那种时候用的。 */
/* 车此刻所在【那一段路】的方向。
   取折线上前后各 W 米的两点连成弦 —— 窗口开在【路径的弧长】上，所以这条弦
   永远贴着道路走，不会像"两个时刻的插值点连线"那样横跨到别的路段去。

   ⚠️ W 为什么是 22 而不是几米：站牌在路边，A* 为了够到它会从主路拐进去再
   拐回来，于是每个站前后都有一小段【方向真的反向 180°】的支线。窗口太小
   会忠实地跟着翻，箭头就在每个站点原地掉头一次。22m 刚好跨过这段支线。
   实测（全线路逐 10 秒采样）：
     窗口 8m  → 突转>90° 55 次    窗口 22m → 约 34 次    窗口 60m → 0 次
   但 60m 会把真实的转弯也一起抹平，所以停在 22m，剩下的交给下面的转速上限。 */
const BUS_AIM_W = 22;   // 求朝向时前后各看多远（米）

/* 沿【整条线路】的折线走 d 米取点，d 可以为负、也可以超出本段 ——
   会顺着相邻站的路径继续走。跑出线路两端时返回 null。

   ⚠️ 这个「跨段」是关键，不能退回成在本段内 clamp。
   A* 为了够到路边的站牌，会从主路拐进去再拐回来，于是【每段路径的首尾】
   都有一小段方向真的反向的支线（74 段里 25 段起点、27 段终点是这样）。
   在段内 clamp 的话，车一接近站点，窗口就整个落在支线上，算出来的方向来回
   翻 —— 实测离站 15m 内 p90 转角 153°，而 60m 外只有 16°。
   跨段之后，窗口会横跨「进站前的路 → 站牌 → 出站后的路」，弦自然指向通过
   方向，支线被跨过去了。（2026-08-17 用户报的「靠近车站时箭头乱转圈」） */
function busPtAlong(stops, i, d) {
  while (d < 0) {
    if (i <= 0) return null;
    const prev = stops[i - 1];
    if (!prev._cum) return null;
    d += prev._cum[prev._cum.length - 1];
    i--;
  }
  for (;;) {
    const s = stops[i];
    if (!s || !s._cum) return null;
    const tot = s._cum[s._cum.length - 1];
    if (d <= tot || i >= stops.length - 2) return alongPath(s.path, s._cum, tot > 0 ? Math.min(1, d / tot) : 0);
    d -= tot; i++;
  }
}

/* 车此刻所在那一段路的方向。窗口开在【路径弧长】上，所以弦永远贴着道路。 */
function alongPathBearing(stops, i, k) {
  const s = stops[i];
  const total = s._cum[s._cum.length - 1];
  if (!(total > 0)) return null;
  const want = total * Math.max(0, Math.min(1, k));
  const W = BUS_AIM_W;
  const p = busPtAlong(stops, i, want - W) || alongPath(s.path, s._cum, 0);
  const q = busPtAlong(stops, i, want + W) || alongPath(s.path, s._cum, 1);
  const dy = (q[0] - p[0]) * MLAT, dx = (q[1] - p[1]) * MLON;
  const chord = Math.hypot(dx, dy);
  /* 兜底：弦比走过的弧长短太多，说明这段路在窗口里折回来了（真·尽头支线）。
     这种时候方向是没有意义的，返回 null 让箭头沿用上一次 —— 保持原方向
     远好过转一个假的方向。 */
  if (chord < 0.5 || chord < W * 0.35) return null;
  return (Math.atan2(dx, dy) * 180 / Math.PI + 360) % 360;
}

function busHeading(stops, t) {
  /* 首选：直接读所在路段的切向 —— 这才是「沿着道路」。
     ⚠️ 不要退回用「t 与 t+0.05 两个插值点的连线」求方向：0.05 分钟约 3 秒，
     按 20km/h 是 17 米，这条弦会横跨好几个折点，弯道上指向截然不同的方位；
     碰上 A* 为够到路边站牌绕出的「进去再出来」支线时甚至会整个反向。 */
  for (let i = 0; i < stops.length - 1; i++) {
    const a = stops[i], b = stops[i + 1];
    if (t < a.offset || t > b.offset) continue;
    if (a._cum && Array.isArray(a.path)) {
      const span = b.offset - a.offset;
      const h = alongPathBearing(stops, i, span > 0 ? (t - a.offset) / span : 1);
      if (h != null) return h;
    }
    break;
  }
  // 退路：这一段没有车行道折线（校外段、建路径时判异常的段），只能按直线求
  const a = busInterpolate(stops, t);
  if (!a) return null;
  let b = busInterpolate(stops, t + 0.05), rev = false;
  if (!b) { b = busInterpolate(stops, t - 0.05); rev = true; }   // 已到终点，往回取样再反向
  if (!b) return null;
  const dy = (b[0] - a[0]) * MLAT, dx = (b[1] - a[1]) * MLON;
  // 位移太小时方位角是噪声（零区间、停站），返回 null 让调用方沿用上一次的方向，
  // 否则箭头会在原地乱转，比没有箭头更干扰
  if (Math.hypot(dx, dy) < 0.5) return null;
  const deg = Math.atan2(dx, dy) * 180 / Math.PI;
  return ((rev ? deg + 180 : deg) + 360) % 360;
}

/** 当前在途的班次位置 */
function busPositions() {
  const t = tokyoNow(), out = [];
  for (const rid in busRoutes.routes) {
    const rt = busRoutes.routes[rid], line = busLineOf(rid);
    if (!line || !rt.stops.length) continue;
    const total = rt.stops[rt.stops.length - 1].offset;
    for (const fr of busFrames()) {
      for (const dep0 of busDepartures(line, fr.dayType)) {
        const dep = dep0 + fr.shift;          // 今天时间轴上的発車时刻
        const el = t.min - dep;
        if (el < 0 || el > total) continue;
        const p = busInterpolate(rt.stops, el);
        if (p) out.push({ line, dep, lat: p[0], lon: p[1], heading: busHeading(rt.stops, el) });
      }
    }
  }
  return out;
}

/* 车辆 marker 复用池，key = 线路@发车时刻。
   ⚠️ 不要每帧重建图层 —— 重建会让 DOM 节点整个换掉，CSS 过渡失去起点，
   于是无论帧率多高都是「瞬移」。要平滑就必须是【同一个元素】被 setLatLng，
   由浏览器在两次位置之间补间。 */
const busMarkers = new Map();

/* 把箭头转到行进方向。
   ⚠️ 转的是外圈那个环，不是整个徽章 —— 整体旋转的话 🚌 会跟着转成倒的。
   heading 为 null（停站、零区间、位移过小）时【保持上一次的角度】，
   不要归零：归零会让箭头在车停下的瞬间"啪"地弹回正北。 */
function busAim(m, heading) {
  if (heading == null) return;
  const el = m.getElement();
  if (!el) return;
  const ring = el.querySelector('.bus-ring');
  if (!ring) return;
  /* 角度要【连续累加】，不能直接写 busHeading 给的 0–360 原值。
     CSS 的 rotate 是按数值线性插值的：355deg → 5deg 会倒着转 350 度，
     看上去就是箭头自己转一圈（2026-08-17 用户报的「箭头自己转圈」）。
     只要路朝北，每次跨过 0/360 都会转一圈。
     取最短转向再累加 —— 值可能超过 360 或变负，但每次只走该走的那几度。 */
  const short = (x) => ((x % 360) + 540) % 360 - 180;      // 归一到 [-180,180)
  const prev = m._aim == null ? heading : m._aim;
  let d = short(heading - prev);

  /* 大反向要「复核」才认。
     巴士线路真的掉头这件事几乎不存在；而 A* 为够到路边站牌绕出的支线会在
     站点前后造出假的 180° 反向 —— 靠近站点 15m 内实测仍有 23 次 >90° 的
     跳变，跨段取窗口也消不掉（那是真·尽头支线，几何上无解）。
     ⚠️ 别再用「限速慢慢转过去」的办法：那只是把瞬间翻转摊成了持续几秒的
     旋转，反而更像"箭头自己在转圈"（2026-08-17 用户第二次反馈就是这个）。
     改成按兵不动：连续两次都指向大致相同的新方向才放行，一次性的直接忽略。 */
  if (Math.abs(d) > 90) {
    if (m._susp == null || Math.abs(short(heading - m._susp)) > 30) {
      m._susp = heading;                                   // 存疑，这一拍不动
      return;
    }
  }
  m._susp = null;

  /* 转速上限。真实巴士不可能在一秒内掉头，剩下的锯齿摊平即可。 */
  const MAX_TURN = 45;                                     // 度／次（每秒一次）
  if (d > MAX_TURN) d = MAX_TURN; else if (d < -MAX_TURN) d = -MAX_TURN;
  const next = prev + d;
  m._aim = next;
  ring.style.transform = 'rotate(' + next.toFixed(1) + 'deg)';
}

function busRender() {
  if (!BUS_ANIM || !busRoutes) return;
  // 用地图实际的 minZoom 兜底：闸门永远不会高于用户能达到的最小缩放
  const gate = Math.min(BUS_MIN_ZOOM, map.getMinZoom());
  /* 只画【当前视野内】的车。
     线路已扩到 10 条，同屏在途车最多七八辆，其中不少在校外区段上 ——
     画在画面之外既看不见也白耗每秒一次的 setLatLng。
     稍微放宽一点边界（pad），免得车在屏幕边缘反复进出、一闪一闪。 */
  const view = map.getBounds().pad(0.25);
  const list = map.getZoom() >= gate
    ? busPositions().filter(b => view.contains([b.lat, b.lon])) : [];

  if (!busLayer) busLayer = L.layerGroup().addTo(map);
  const alive = new Set();

  for (const b of list) {
    const id = b.line.id + '@' + b.dep;
    alive.add(id);
    let m = busMarkers.get(id);
    if (m) {
      m.setLatLng([b.lat, b.lon]);
      busAim(m, b.heading);
    } else {
      m = L.marker([b.lat, b.lon], { keyboard: false, zIndexOffset: 500, icon: L.divIcon({
        className: 'bus-marker', iconSize: [30, 30], iconAnchor: [15, 15],
        html: '<div class="bus-ring"><i></i></div><div class="bus-dot">🚌</div>' }) });
      m.on('click', e => L.popup().setLatLng(e.latlng).setContent(
        `<div class="popup-name">🚌 ${busEsc(busLineName(b.line))}</div>
         <div class="popup-sub">${busEsc(busLineDir(b.line))} · ${busHHMM(b.dep)} ${busEsc(TB('depart'))}</div>
         <div style="font-size:10px;color:#999;margin-top:4px">${busEsc(TB('est'))}</div>`
      ).openOn(map));
      m.addTo(busLayer);
      busMarkers.set(id, m);
      busAim(m, b.heading);
      // 新出现的车不做过渡：它是从校外刚进图的，补间会让它从上一辆车的位置滑过来
      const el = m.getElement();
      if (el) { el.style.transition = 'none'; requestAnimationFrame(() => {
        if (m.getElement()) m.getElement().style.transition = ''; }); }
    }
  }
  // 已经到终点或已发车太久的，从池子里摘掉
  for (const [id, m] of busMarkers) {
    if (!alive.has(id)) { busLayer.removeLayer(m); busMarkers.delete(id); }
  }
  busNote(list.length > 0);
}

/** 有车在屏幕上时的角标。plan-bus.md §2.4：这条是必须的，
    不能让人把推算出来的位置当成实时定位。 */
function busNote(on) {
  if (!on) { if (busNoteEl) { busNoteEl.remove(); busNoteEl = null; } return; }
  if (busNoteEl) { busNoteEl.textContent = '🚌 ' + TB('est'); return; }
  busNoteEl = document.createElement('div');
  busNoteEl.textContent = '🚌 ' + TB('est');
  busNoteEl.style.cssText = 'position:fixed;left:10px;bottom:34px;z-index:1100;' +
    'background:rgba(255,255,255,0.9);border-radius:8px;padding:3px 8px;' +
    'font-size:10px;color:#777;box-shadow:0 1px 6px rgba(0,0,0,0.1);pointer-events:none';
  document.body.appendChild(busNoteEl);
}

/* 某站今天剩余的班次，【按方向分开】。
   toward='campus' 是往校内开的（对刚下地铁的人有用），
   toward='town'   是往学研都市駅/前原开的（对要回市区的人有用）。

   分方向是必须的：校内每个站马路两侧各有一根站牌，数据里没有方向字段，
   分不出用户点的是哪根。以前只有去程数据时，弹窗只能说「到着」并挂一句
   「回程未收录」—— 站在校内等车回市区的人从这张图上什么也得不到。 */
function busTimesAt(stopName) {
  const t = tokyoNow(), frames = busFrames();
  const by = { campus: [], town: [] };
  for (const rid in busRoutes.routes) {
    const rt = busRoutes.routes[rid], line = busLineOf(rid);
    if (!line) continue;
    const st = rt.stops.find(s => s.name === stopName);
    if (!st) continue;
    const bucket = by[rt.toward || 'campus'];
    for (const fr of frames)
      for (const dep0 of busDepartures(line, fr.dayType)) {
        const dep = dep0 + fr.shift;
        bucket.push({ line, dep, at: dep + st.offset });
      }
  }
  const trim = (arr) => arr.filter(x => x.at >= t.min).sort((a, b) => a.at - b.at);
  /* 每个方向实际开往哪儿。不能用写死的「往市区（车站 / 博多・天神）」——
     糸島線的出校园方向开往【前原駅北口】，那是糸島市，和博多正好相反。
     在国際村前照那句话上车会朝反方向走。
     线路自带 direction/direction_zh，此前只用在车辆弹窗上，站点弹窗漏了。
     用 trim 之前的全量：今天没车了不代表这个站不通那个方向。 */
  const destsOf = (arr) => {
    const seen = new Set();
    for (const x of arr) {
      const d = busLineDest(x.line);
      if (d) seen.add(d);
    }
    return [...seen];
  };
  return {
    dayType: frames[0].dayType, now: t.min,
    campus: trim(by.campus), town: trim(by.town),
    campusDest: destsOf(by.campus), townDest: destsOf(by.town),
    // 该站是否【根本没有】某个方向的车 —— 九大理学部就是这样：回程不停。
    // 「今天没车了」和「这个方向本来就不停」是两回事，弹窗要分开说。
    hasCampus: by.campus.length > 0, hasTown: by.town.length > 0,
  };
}

/** 巴士站弹窗：今日到达时刻 + 下一班倒计时。 */
function openBusStopPopup(latlng, f) {
  /* 查时刻表用 bus_name，显示用 name。两者多数时候相同，但有三根站牌不是：
       山手              ← 时刻表里叫「山手（福岡市西区）」（NaviTime 的消歧后缀）
       桑原公民館         ← 同上，「桑原公民館（福岡県）」
       九大ビックオレンジ  ← OSM 把浊点拼错了，时刻表里是「ビッグオレンジ」
     以前直接拿 name 去查，这三根点开一律显示「本站未收录时刻表」。
     bus_name 由 scripts/filter_bus_stops.js 在同步后盖上，前端不自带映射表。 */
  const name = f.bus_name || f.name || '';
  const head = `<div class="popup-name">🚌 ${busEsc(facName(f) || f.name || '')}</div>`;
  const btns = `<div class="popup-btns" style="margin-top:6px">
      <button onclick="setRoute('from', ${f.lon}, ${f.lat})">${T('from')}</button>
      <button class="primary" onclick="setRoute('to', ${f.lon}, ${f.lat})">${T('to')}</button>
    </div>`;
  if (!busRoutes || !busStopNames.has(name)) {
    L.popup().setLatLng(latlng).setContent(
      head + `<div class="popup-sub">${busEsc(TB('noData'))}</div>` + btns).openOn(map);
    return;
  }
  const r = busTimesAt(name);
  const dayName = (TB('day') || {})[r.dayType] || r.dayType;
  // お盆期间班次与平时不同，光显示「日祝」会让人以为我们判错了日子
  const obonTip = busIsObon(tokyoNow().iso)
    ? `<div style="font-size:10px;color:#ad6800;background:#fff7e6;border-radius:4px;
         padding:3px 6px;margin-top:4px">${busEsc(TB('obon'))}</div>` : '';

  /* 同一个站名在图上常有两个点 —— 上下行各一根站牌。用户点的是其中一根，
     弹窗却把两个方向的班次都列出来，等于告诉站在回程侧的人「8 分钟后有车
     往校内」，而那班车在马路对面。

     facilities 的 bus_dir 说明这根牌服务哪个方向，由 scripts/assign_pole_dir.js
     从 OSM 的公交线路关系（含按方向排序的站点成员）比对站序得出 —— 是数据，
     不是推断。35 根牌里标出 21 根，覆盖了 23 根「两个方向都停」中的 21 根。

     ⚠️ 别改回自己算几何。三种几何判据都试过并且都不成立：
       ① 「靠左行驶 → 牌在行进方向左侧」：判据对，但很多同名牌是沿路前后
          错开的（九大工学部两根相距 87m、垂直只差 2.5m），左右没有定义；
       ② 「每根牌贴着自己方向的路」：思路对，但 bus-routes.json 每个站名只存
          一个坐标，两个方向的 A* 路径都从牌1 穿过（实测距离全是 0.0m），
          拿它反推是循环论证；
       ③ 「在不在往校内的关系里」：不够 —— 4 番与 1A/2 番在东区反向行驶，
          同一站两根牌各属一条，两根都会命中。要看关系里的站序才分得开。

     bus_dir 未知时退回一条永远成立的规则（靠左行驶 → 面朝去向，等左手边那根）。 */
  const myDir = f.bus_dir || null;
  const both = r.hasCampus && r.hasTown;
  // 文案里带 <b> 强调「左手边」。输入是 BUS_I18N 的固定字面量，不是设施名
  // 那种外部数据，所以不过 busEsc —— 过了会把标签显示成源码。
  const poleTip = (both && !myDir)
    ? `<div style="font-size:10px;color:#1d39c4;background:#f0f5ff;border-radius:4px;
         padding:4px 6px;margin-top:4px;line-height:1.5">${TB('twoPole')}</div>` : '';

  /* 一个方向的那一段。
     三种状态要分开说，它们对用户意味着完全不同的事：
       ① 这个方向本来就不停车（九大理学部的回程）→ 别在这儿等，去别的站
       ② 停，但今天没车了                        → 今天别等了
       ③ 有车                                   → 几点几分
     另外 mine 标出「这根牌 / 对面那根」，只在两个方向都有车且已知方向时才给
     —— 单方向站没有对面可言，标了反而像在暗示还有另一根。 */
  function section(icon, label, list, has, color, dirKey, dests) {
    const mine = (both && myDir) ? (dirKey === myDir) : null;
    /* 具体开往哪儿。写在方向下面而不是塞进标题：同一个站可能同时通
       学研都市駅 / 前原 / 博多三个方向，并进标题会把那一行挤爆。 */
    const destLine = (has && dests && dests.length)
      ? `<div style="font-size:10px;color:#8c8c8c;margin:1px 0 2px">` +
        `${busEsc(TB('bound'))} ${busEsc(dests.slice(0, 3).join(' / '))}</div>` : '';
    const badge = mine === null ? ''
      : mine ? `<span style="font-size:9px;font-weight:600;color:#fff;background:${color};
                  border-radius:3px;padding:1px 4px;margin-left:4px">${busEsc(TB('thisPole'))}</span>`
             : `<span style="font-size:9px;color:#999;border:1px solid #d9d9d9;
                  border-radius:3px;padding:1px 4px;margin-left:4px">${busEsc(TB('otherPole'))}</span>`;
    let inner;
    if (!has) {
      inner = `<div style="font-size:11px;color:#999">${busEsc(TB('noService'))}</div>`;
    } else if (!list.length) {
      inner = `<div style="font-size:11px;color:#999">${busEsc(TB('none'))}</div>`;
    } else {
      // tokyoNow 带小数分钟，倒计时取整。用 floor 而不是 round：
      // 宁可少报一分钟让人早点动身，也不要多报一分钟让人错过车。
      const n = list[0], wait = Math.floor(n.at - r.now);
      // 倒计时只在「值得等」的范围内显示。深夜点开时下一班可能是第二天早上，
      // 写成「454 分钟后」技术上没错，但没人会这么读时间。
      const cd = wait <= 0 ? busEsc(TB('soon'))
               : wait <= 90 ? busEsc(TB('inMin')(wait)) : '';
      /* 后续时刻要按【分钟】去重。同一分钟常有两条线的车（08:56 既有横浜西
         也有周船寺），不去重就会显示成「08:56 … 08:56 · 09:20」——
         数据是真的，但读起来像 bug，而且白占一格。 */
      const seenMin = new Set([n.at]);
      const rest = [];
      for (const x of list.slice(1)) {
        if (seenMin.has(x.at)) continue;
        seenMin.add(x.at); rest.push(busHHMM(x.at));
        if (rest.length >= 3) break;
      }
      const restStr = rest.join(' · ');
      inner =
        `<div style="margin:2px 0"><b>${busHHMM(n.at)}</b>` +
        `${cd ? ` <span style="color:${color}">（${cd}）</span>` : ''}</div>` +
        `<div style="font-size:11px;color:#666">${busEsc(busLineName(n.line))}</div>` +
        (restStr ? `<div style="font-size:11px;color:#888;margin-top:2px">${restStr}</div>` : '');
    }
    // 对面那根的班次压暗：信息还在（用得上「回程什么时候有车」），
    // 但一眼能看出「这不是你脚下这根牌的车」。
    return `<div style="margin-top:7px;padding-left:7px;border-left:3px solid ${color};` +
           `${mine === false ? 'opacity:.55' : ''}">` +
           `<div style="font-size:11px;font-weight:600;color:${color}">${icon} ${busEsc(label)}${badge}</div>` +
           destLine + inner + `</div>`;
  }

  // 祝日表是有尽头的（当前收到 2027-11-23）。过了这个日期，busDayType 会把所有
  // 祝日静默当成平日算 —— 那是「看起来正常但其实错了」，必须自己说出来。
  const t2 = tokyoNow();
  const stale = (busHolidayLast && t2.iso > busHolidayLast)
    ? `<div style="font-size:10px;color:#cf1322;margin-top:3px">⚠️ ${busEsc(busHolidayLast)} 之后的节假日未收录</div>`
    : '';

  L.popup().setLatLng(latlng).setContent(
    head +
    `<div class="popup-sub">${busEsc(dayName)}</div>` +
    obonTip + poleTip +
    /* 这根牌自己的方向排在前面。人点开站牌是为了「我在这儿等的车几点到」，
       把对面那根的班次摆第一栏，等于让他先读一段和自己无关的信息。 */
    (myDir === 'town'
      ? section('🚏', TB('toTown'), r.town, r.hasTown, '#07835a', 'town', r.townDest) +
        section('🚌', TB('toCampus'), r.campus, r.hasCampus, '#8b1f41', 'campus', r.campusDest)
      : section('🚌', TB('toCampus'), r.campus, r.hasCampus, '#8b1f41', 'campus', r.campusDest) +
        section('🚏', TB('toTown'), r.town, r.hasTown, '#07835a', 'town', r.townDest)) +
    `<div style="font-size:10px;color:#999;margin-top:6px">${busEsc(TB('est'))}` +
    (busSchedule.fetched ? ` · ${busEsc(TB('updated'))} ${busEsc(busSchedule.fetched)}` : '') +
    `</div>` + stale + btns
  ).openOn(map);
}

/* ================= A* 导航 ================= */
const MLON = 111320 * Math.cos(33.6 * Math.PI / 180), MLAT = 111320;
let adjIndex = null;
function buildGraphIndex() {
  adjIndex = graph.nodes.map(() => []);
  for (const [i, j, w] of graph.edges) {
    adjIndex[i].push([j, w]);
    adjIndex[j].push([i, w]);
  }
}
function nearestNode(lon, lat) {
  let best = -1, bd = Infinity;
  graph.nodes.forEach(([nlon, nlat], i) => {
    const d = ((nlon - lon) * MLON) ** 2 + ((nlat - lat) * MLAT) ** 2;
    if (d < bd) { bd = d; best = i; }
  });
  return best;
}
/** 最近路段投影：返回 {i, j, w, t, lon, lat}（t 为投影在边上的比例）。
 *  比"最近节点"准确：端点从投影点接入路网，接驳段不再乱跳。 */
function nearestEdgePoint(lon, lat) {
  const px = lon * MLON, py = lat * MLAT;
  let best = null, bd = Infinity;
  for (const [i, j, w] of graph.edges) {
    const ax = graph.nodes[i][0] * MLON, ay = graph.nodes[i][1] * MLAT;
    const bx = graph.nodes[j][0] * MLON, by = graph.nodes[j][1] * MLAT;
    const dx = bx - ax, dy = by - ay;
    const t = (dx === 0 && dy === 0) ? 0
      : Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy)));
    const d = Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
    if (d < bd) { bd = d; best = { i, j, w, t, lon: (ax + t * dx) / MLON, lat: (ay + t * dy) / MLAT }; }
  }
  return best;
}
/** 带虚拟端点的寻路：起终点先投影到最近路段，再以部分边权接入图 */
function routeBetween(from, to) {
  const s = nearestEdgePoint(from[0], from[1]), e = nearestEdgePoint(to[0], to[1]);
  if (!s || !e) return null;
  const vs = graph.nodes.length, ve = vs + 1;
  graph.nodes.push([s.lon, s.lat], [e.lon, e.lat]);
  adjIndex.push([], []);
  const added = [];
  const link = (v, node, w) => {
    adjIndex[v].push([node, w]); adjIndex[node].push([v, w]); added.push(node);
  };
  link(vs, s.i, s.w * s.t); link(vs, s.j, s.w * (1 - s.t));
  link(ve, e.i, e.w * e.t); link(ve, e.j, e.w * (1 - e.t));
  const path = astar(vs, ve);
  let result = null;
  if (path) {
    result = { lls: path.map(i => [graph.nodes[i][1], graph.nodes[i][0]]), dist: 0 };
    for (let k = 1; k < path.length; k++) result.dist += heuristic(path[k - 1], path[k]);
  }
  // 还原图（虚拟节点与反向连接全部撤除）
  graph.nodes.length = vs; adjIndex.length = vs;
  for (let k = added.length - 1; k >= 0; k--) adjIndex[added[k]].pop();
  return result;
}
function heuristic(i, goal) {
  const [alon, alat] = graph.nodes[i], [blon, blat] = graph.nodes[goal];
  return Math.hypot((alon - blon) * MLON, (alat - blat) * MLAT);
}
/** A*：返回节点索引路径（教科书实现，open set 用数组扫描——3k 节点足够快） */
function astar(start, goal) {
  const g = new Map([[start, 0]]), f = new Map([[start, heuristic(start, goal)]]);
  const came = new Map(), open = new Set([start]);
  while (open.size) {
    let cur = null, bf = Infinity;
    for (const n of open) if (f.get(n) < bf) { bf = f.get(n); cur = n; }
    if (cur === goal) {
      const path = [cur];
      while (came.has(cur)) { cur = came.get(cur); path.push(cur); }
      return path.reverse();
    }
    open.delete(cur);
    for (const [nb, w] of adjIndex[cur]) {
      const t = g.get(cur) + w;
      if (t < (g.get(nb) ?? Infinity)) {
        came.set(nb, cur); g.set(nb, t);
        f.set(nb, t + heuristic(nb, goal));
        open.add(nb);
      }
    }
  }
  return null;
}

let routeLine = null, routeMarks = [];
let routeFrom = null, routeTo = null;   // [lon, lat]
function setRoute(which, lon, lat) {
  const ACK = 'kyudai_route_disclaimer_ack';
  let acked = false;
  try { acked = localStorage.getItem(ACK) === '1'; } catch (e) {}

  }

}
function doSetRoute(which, lon, lat) {

  if (!routeFrom || !routeTo) {

}
/** 导航声明：选择出发点 / 目的地时弹出；勾选「以后不弹出」后写入 localStorage，不再提示 */

function drawRoute() {
  clearRoute(false);
  const r = routeBetween(routeFrom, routeTo);
  if (!r) { $('routebar').innerHTML = '⚠️ no path'; return; }
  const lls = r.lls, dist = r.dist;
  // 端点到路网的接驳段（虚线）
  const head = [[routeFrom[1], routeFrom[0]], lls[0]];
  const tail = [lls[lls.length - 1], [routeTo[1], routeTo[0]]];
  // 路线专用画布：在建筑画布之后创建 → 叠放其上，且路线加白色 casing 压彩色建筑仍清晰
  if (!window.routeRenderer) window.routeRenderer = L.canvas();
  const RR = window.routeRenderer;
  routeLine = L.layerGroup([
    L.polyline(lls, { renderer: RR, color: '#ffffff', weight: 8, opacity: 0.9 }),
    L.polyline(head, { renderer: RR, color: '#8b1f41', weight: 3, dashArray: '4 6', opacity: 0.7 }),
    L.polyline(lls, { renderer: RR, color: '#8b1f41', weight: 5, opacity: 0.85 }),
    L.polyline(tail, { renderer: RR, color: '#8b1f41', weight: 3, dashArray: '4 6', opacity: 0.7 }),
  ]).addTo(map);
  routeMarks = [
    L.marker([routeFrom[1], routeFrom[0]], {
    icon: L.divIcon({ className: '', html: '<div style="font-size:24px">📍</div>', iconSize: [24,24], iconAnchor: [12,24] })
  }).addTo(map),
    L.marker([routeTo[1], routeTo[0]], {
    icon: L.divIcon({ className: '', html: '<div style="font-size:24px">🏁</div>', iconSize: [24,24], iconAnchor: [12,24] })
  }).addTo(map),
  ];
  map.fitBounds(L.latLngBounds([...head, ...lls, ...tail]).pad(0.2));
  const total = Math.round(dist);
  $('routebar').style.display = 'block';
  $('routebar').innerHTML = T('route')(total, Math.max(1, Math.round(total / 80)))
    + `<button onclick="clearRoute(true)">${T('clear')}</button>`;
}
function clearRoute(reset) {
  if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
  routeMarks.forEach(m => map.removeLayer(m)); routeMarks = [];
  if (reset) { routeFrom = routeTo = null; $('routebar').style.display = 'none'; }
}

/* ================= 搜索 ================= */
/** 归一化：小写、全角→半角、去空格与常见标点。
 *  使 "West2号馆" / "Ｗ２" / "west 2 号馆" 都能对上 "West 2号馆（售店·书店）" */
function norm(s) {
  return (s || '')
    .replace(/[！-～]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
    .toLowerCase()
    .replace(/[\s　・·、，,。.（）()【】\[\]「」『』\-—–_/]/g, '');
}
/** 从名称生成短码别名：West 2号馆→w2/west2/ウエスト2、Center 3→c3、East 1→e1 */
function shortCodes(hay) {
  const codes = [];
  let m;
  const re = /(west|center|east|ウエスト|センター|イースト)\s*(\d)/gi;
  while ((m = re.exec(hay)) !== null) {
    const zone = { west: 'w', center: 'c', east: 'e',
                   ウエスト: 'w', センター: 'c', イースト: 'e' }[m[1].toLowerCase()] || m[1][0];
    const n = m[2];
    codes.push(zone + n, `west${n}`, `center${n}`, `east${n}`,
               `ウエスト${n}`, `センター${n}`, `イースト${n}`,
               `${zone === 'w' ? 'west' : zone === 'c' ? 'center' : 'east'}${n}号馆`,
               `${zone === 'w' ? 'ウエスト' : zone === 'c' ? 'センター' : 'イースト'}${n}号館`);
  }
  return codes;
}
/** 建筑搜索索引（归一化 haystack + 短码），语言无关，构建一次 */
let bldIndex = null;
function buildingIndex() {
  if (bldIndex) return bldIndex;
  bldIndex = buildings.map(f => {
    const a = annotations[f.properties.id] || {};
    // aliases 必须算进检索文本。
    // classrooms.json 早就在用这个字段、searchAll 的教室分支也读了，唯独建筑这一支漏了，
    // 结果是「给建筑挂别名」这件事一直没生效。补上之后才能让「農学府」这类
    // 官方名里根本不含的说法命中到具体建筑。
    const raw = [f.properties.name, f.properties.name_ja, f.properties.name_en,
                 a.name_zh, a.name_ja, a.name_en]
                 .concat(a.aliases || [])
                 .filter(Boolean).join('\n');
    if (!raw) return null;
    return { f, hay: norm(raw) + '\n' + shortCodes(raw).map(norm).join('\n') };
  });
  return bldIndex;
}
function centroidOf(f) {
  const r = f.geometry.coordinates[0];
  let x = 0, y = 0;
  for (const p of r) { x += p[0]; y += p[1]; }
  return [x / r.length, y / r.length];
}
/** 办公室条目的检索文本：官方名三语 + 全部别名（别名里含它服务的所有学部学府） */
function officeHay(o) {
  return norm([o.name_ja, o.name_zh, o.name_en, o.buildingName_ja, o.buildingName_zh, o.room]
    .concat(o.aliases || []).filter(Boolean).join('\n'));
}

function searchAll(q) {
  q = norm(q);
  if (!q) return [];
  const out = [];

  // 办公室排在最前面。
  // 因为「農学府」「学務課」这类查询，用户要的是「该去哪个窗口」，
  // 而不是某栋恰好名字里含「農」的楼。放后面的话会被建筑层的模糊命中淹掉。
  for (const o of offices) {
    if (officeHay(o).includes(q)) out.push({ kind: 'office', obj: o });
    if (out.length >= 30) return out;
  }
  // 不在伊都校区的学部学府：也要能搜到，但只弹说明不导航
  for (const e of elsewhere) {
    const hay = norm([e.name_ja, e.name_zh, e.name_en].concat(e.aliases || []).filter(Boolean).join('\n'));
    if (hay.includes(q)) out.push({ kind: 'elsewhere', obj: e });
    if (out.length >= 30) return out;
  }

  // 教室：code / 名称 / 别名（全部归一化比对）
  for (const c of classrooms) {
    const hay = norm([c.code, c.name_zh, c.name_ja, c.name_en, ...(c.aliases || [])]
      .filter(Boolean).join('\n'));
    if (hay.includes(q)) out.push({ kind: 'room', obj: c });
    if (out.length >= 30) return out;
  }
  for (const e of buildingIndex()) {
    if (e && e.hay.includes(q)) out.push({ kind: 'building', obj: e.f });
    if (out.length >= 30) break;
  }
  for (const p of pois) {
    const hay = norm([p.name_zh, p.name_ja, p.name_en].filter(Boolean).join('\n'));
    if (hay.includes(q)) out.push({ kind: 'poi', obj: p });
    if (out.length >= 30) break;
  }
  /* 有名字的设施：ローソン / モスバーガー / TSUTAYA / 福岡銀行ATM / 巴士站名…
     此前 searchAll 完全不看 facilities，203 个设施里 109 个有名字，结果是：
       · 13 个完全搜不到（一番うどん / 家又家 / 生協）
       · 18 个被 detectIntent 抢走，掉进几十条的分类列表里要自己翻
       · 其余落到模糊兜底上给出错的东西 —— 搜「TSUTAYA」返回「学务部学生支援课」
     排在最后：查询词更可能指向一栋楼或一个窗口，设施是补充。
     ⚠️ 只收有名字的。AED 点和绝大多数厕所没有 name，放进来只会让结果里
     跟着一串「(无名)」，把真正有用的条目挤下去。 */
  for (const f of facilities) {
    if (!f.name && !f.name_en) continue;
    const hay = norm([f.name, f.name_en].filter(Boolean).join('\n'));
    if (hay.includes(q)) out.push({ kind: 'facility', obj: f });
    if (out.length >= 30) break;
  }

  // 精确匹配一个都没有时，降级为模糊匹配。
  //
  // 此前无结果就是一片空白，用户分不清是「这里没有」还是「我搜错了」——
  // 而这两种情况该做的事完全不同。降级后至少能给出「你是不是想找这些」，
  // 让用户自己判断。代价是结果会有噪音，所以只在零命中时启用，且标注为「相近」。
  if (!out.length) return fuzzySearch(q);
  return out;
}

/**
 * 模糊兜底：把查询拆成 2 字滑窗，任一片段命中即算相近，按命中片段数排序。
 * 例：搜「工学府事務室」精确无果 → 拆出「工学」「学府」「府事」「事務」「務室」，
 * 「工学」会命中工学部等事务部与若干工学系建筑。
 */
function fuzzySearch(q) {
  const grams = [];
  for (let i = 0; i + 2 <= q.length; i++) grams.push(q.slice(i, i + 2));
  if (!grams.length) return [];

  const scored = [];
  const push = (kind, obj, hay) => {
    let s = 0;
    for (const g of grams) if (hay.includes(g)) s++;
    if (s > 0) scored.push({ kind, obj, fuzzy: true, score: s });
  };

  for (const o of offices) push('office', o, officeHay(o));
  for (const e of buildingIndex()) if (e) push('building', e.f, e.hay);
  for (const c of classrooms) {
    push('room', c, norm([c.code, c.name_zh, c.name_ja, c.name_en, ...(c.aliases || [])].filter(Boolean).join('\n')));
  }
  for (const p of pois) push('poi', p, norm([p.name_zh, p.name_ja, p.name_en].filter(Boolean).join('\n')));
  for (const f of facilities) {
    if (!f.name && !f.name_en) continue;
    push('facility', f, norm([f.name, f.name_en].filter(Boolean).join('\n')));
  }

  /* 命中门槛：长查询必须命中至少两个片段。
     2 字滑窗在片假名和连字符上误命中极凶 —— 「TSUTAYA」和「C-CUBE」原本
     各返回 12 条办公室，全是只中了一个片段的噪音，而用户会当成答案照着跑一趟。
     短查询（3 字以下只切得出 1–2 个片段）维持 1，否则它们会一条都出不来。 */
  const need = grams.length >= 4 ? 2 : 1;
  return scored.filter(x => x.score >= need)
               .sort((a, b) => b.score - a.score)
               .slice(0, 12);
}

const resultsDiv = $('results');
$('q').addEventListener('input', () => {
  /* 类别意图（"食堂在哪里" / "ATMはどこ" / "where is toilet"）优先，
     但【具体名字要压过类别】。

     很多店名本身就含类别词：「童夢カフェ」含カフェ、「シーサイド病院」含病院、
     「福祉型お手洗い」含お手洗い。只看意图的话，搜一家具体的店会掉进几十条
     的分类列表里自己翻 —— 109 个有名字的设施中有 18 个是这种情况。
     所以：查询词若能精确命中某个具体地点的名字，就直接给那个地点。

     ⚠️ 判据是【查询词占那个名字的比例】，不能只看"有没有命中"。
     否则通用词会被某个碰巧含它的长名字劫走：
       "ATM"   → 福岡銀行ATM（占 3/8）        本该给 atm 分类的 8 个点
       "诊疗所" → Center 6号馆·伊都诊疗所（3/13）本该给 health 分类
     而真正在找具体店的人，输的基本就是那个店的全名（占比接近 1）。
     再加 3 字下限，挡住"食堂""厕所"这种一看就是问类别的短词。 */
  const qv = $('q').value;
  const intent = detectIntent(qv);
  const nq = norm(qv);
  const specific = nq.length >= 3 && searchAll(qv).some(r => {
    if (r.fuzzy) return false;
    const nm = norm(r.kind === 'facility' ? (r.obj.name || r.obj.name_en)
             : r.kind === 'building' ? nameOf(r.obj)
             : (r.obj.name_zh || r.obj.name_ja || r.obj.name_en || r.obj.code || ''));
    return nm && nq.length / nm.length >= 0.5;
  });
  if (intent && !specific) {
    if (activeCat !== intent) setCategory(intent);
    showCatResults(intent);
    return;
  }
  if (activeCat) clearCategory();   // 关闭残留类别图层
  const rs = searchAll($('q').value);
  resultsDiv.style.display = rs.length ? 'block' : 'none';
  resultsDiv.innerHTML = rs.map((r, i) => {
    // 模糊兜底的结果必须标出来，否则用户会以为这是精确答案然后照着跑一趟
    const fz = r.fuzzy ? '<span class="r-fuzzy">相近</span>' : '';
    if (r.kind === 'office') {
      const o = r.obj;
      const where = [o.buildingName_ja, o.floor ? o.floor + T('floor') : '', o.room].filter(Boolean).join(' ');
      return `<div class="result-item" data-i="${i}">
        <div class="r-name"><span class="r-tag r-tag-office">窓口</span>${o.name_zh || o.name_ja}${fz}</div>
        <div class="r-sub">${where}${o.tel ? '　☎ ' + o.tel : ''}</div></div>`;
    }
    if (r.kind === 'elsewhere') {
      const e = r.obj;
      // 没有坐标，点了也去不了。直接在结果里把「在哪个校区」说清楚。
      return `<div class="result-item result-item-off" data-i="${i}">
        <div class="r-name"><span class="r-tag r-tag-away">他校区</span>${e.name_zh || e.name_ja}</div>
        <div class="r-sub">不在伊都校区 · ${CAMPUS_TEXT[e.campus] || e.campus}</div></div>`;
    }
    if (r.kind === 'room') {
      const b = buildings.find(f => f.properties.id === r.obj.building);
      const bname = b ? nameOf(b) : '';
      return `<div class="result-item" data-i="${i}">
        <div class="r-name"><span class="r-tag">教室</span>${r.obj.code} ${poiName(r.obj) || ''}</div>
        <div class="r-sub">${bname} ${r.obj.floor || ''}${r.obj.floor ? T('floor') : ''}</div></div>`;
    }
    if (r.kind === 'building')
      return `<div class="result-item" data-i="${i}"><div class="r-name">${nameOf(r.obj)}${fz}</div></div>`;
    if (r.kind === 'facility') {
      const c = catOfType(r.obj.type);
      // 副行写类别名，让「ローソン」一眼看出是便利店，而不是又一栋不知道干嘛的楼
      const sub = c ? ((I18N[lang].chip || I18N.en.chip)[c] || c) : r.obj.type;
      return `<div class="result-item" data-i="${i}">
        <div class="r-name">${c ? CATS[c].icon : '📍'} ${busEsc(facName(r.obj))}${fz}</div>
        <div class="r-sub">${busEsc(sub)}</div></div>`;
    }
    return `<div class="result-item" data-i="${i}">
      <div class="r-name">${(POI_ICON[r.obj.type] || '📌')} ${poiName(r.obj)}${fz}</div></div>`;
  }).join('');
  resultsDiv.querySelectorAll('.result-item').forEach(el => {
    el.addEventListener('click', () => gotoResult(rs[+el.dataset.i]));
  });
});

const CAMPUS_TEXT = {
  hospital: '病院（馬出）校区　福岡市東区馬出3-1-1',
  chikushi: '筑紫校区　春日市春日公園6-1',
  ohashi: '大橋校区　福岡市南区塩原4-9-1'
};

function gotoResult(r) {
  resultsDiv.style.display = 'none';
  $('q').blur();

  // 不在伊都的学部学府：地图上没有它，硬跳只会把人带到错误的地方。
  // 直接告诉他在哪个校区、去哪个窗口，比一个假的定位有用得多。
  if (r.kind === 'elsewhere') {
    const e = r.obj;
    alert(`${e.name_zh || e.name_ja}\n\n不在伊都校区。\n${CAMPUS_TEXT[e.campus] || e.campus}\n${e.note_zh || ''}`);
    return;
  }

  // 办公室：定位到它所在建筑的中心，标题带上楼层房号。
  // 我们只知道「在哪栋楼几层几号房」，不知道房间的精确经纬度 ——
  // 与其编一个坐标，不如把楼定准、把房号写清楚，剩下让人进楼看指示牌。
  if (r.kind === 'office') {
    const o = r.obj;
    const b = buildings.find(f => f.properties.id === o.building);
    if (!b) return;
    const lonlat0 = centroidOf(b);
    const ll0 = [lonlat0[1], lonlat0[0]];
    const where = [o.floor ? o.floor + T('floor') : '', o.room].filter(Boolean).join(' ');
    const title = `${o.name_zh || o.name_ja}\n${nameOf(b)}${where ? ' ' + where : ''}`;
    map.setView(ll0, 18);
    openFeaturePopup(L.latLng(ll0), title, null, lonlat0);
    return;
  }

  /* 设施：巴士站要走时刻表弹窗，其余走普通信息卡。
     与「点分类列表里的一条」保持完全一致的行为 —— 从搜索框进来还是从
     🚏 片进来，点开的东西必须是同一个，否则用户会以为是两个不同的点。 */
  if (r.kind === 'facility') {
    const f = r.obj, ll = [f.lat, f.lon];
    map.setView(ll, 18);
    if (f.type === 'bus_stop') openBusStopPopup(L.latLng(ll), f);
    else {
      const c = catOfType(f.type);
      openFeaturePopup(L.latLng(ll), `${c ? CATS[c].icon + ' ' : ''}${facName(f)}`, null, [f.lon, f.lat]);
    }
    return;
  }

  let lonlat, title;
  if (r.kind === 'building') {
    lonlat = centroidOf(r.obj); title = nameOf(r.obj);
  } else if (r.kind === 'poi') {
    lonlat = [r.obj.lon, r.obj.lat]; title = poiName(r.obj);
  } else {
    const b = buildings.find(f => f.properties.id === r.obj.building);
    if (b) {
      lonlat = centroidOf(b);
      title = `${r.obj.code}（${nameOf(b)}${r.obj.floor ? ' ' + r.obj.floor + T('floor') : ''}）`;
    } else if (r.obj.latlon) {
      // 所在建筑轮廓未定（building_pending）：用配准预测的大致坐标兜底
      lonlat = r.obj.latlon;
      const approx = T('approx');
      title = `${r.obj.code}${approx}`;
    } else return;
  }
  const ll = [lonlat[1], lonlat[0]];
  map.setView(ll, 18);
  openFeaturePopup(L.latLng(ll), title, null, lonlat);
}

/* ================= 语言切换 ================= */
function buildLangSwitch() {
  const sel = document.getElementById('langswitch');
  if (!sel) return;
  sel.innerHTML = Object.keys(I18N).map(k => `<option value="${k}"${k === lang ? ' selected' : ''}>${I18N[k].self}</option>`).join('');
  sel.addEventListener('change', () => {
    lang = sel.value;
    localStorage.setItem('kyudai-lang', lang);
    applyLang();
  });
}
function applyLang() {
  $('q').placeholder = T('search');
  const sel = document.getElementById('langswitch');
  if (sel) sel.value = lang;
  renderBuildings();
  renderPois();
  renderChips();
  const oldLegend = document.getElementById('legend');
  if (oldLegend) oldLegend.remove();
  renderLegend();
  busRender();          // 巴士角标的文案跟着语言走
}
// buildLangSwitch 在 DOMContentLoaded 中调用
