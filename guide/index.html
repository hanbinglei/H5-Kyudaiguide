<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#7B2D3E">
<title>Kyudai Guide · 九大伊都 留学生ガイド</title>
<meta name="description" content="Guide, campus map, academic calendar and faculty links for international students at Kyushu University Ito Campus. 中文 / 日本語 / English / 한국어. Works offline.">

<!-- 分享卡片：学生之间主要靠 LINE / 微信群转发，没有这几行贴出去就只是一条裸链接 -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Kyudai Guide">
<meta property="og:title" content="Kyudai Guide · 九大伊都 留学生ガイド">
<meta property="og:description" content="入境·在留·租房·银行·交通·应急 12 篇指南 + 校园地图 + 学年历。中文 / 日本語 / English / 한국어，可离线。">
<meta property="og:image" content="https://hanbinglei.github.io/H5-Kyudaiguide/guide/og-cover.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://hanbinglei.github.io/H5-Kyudaiguide/guide/">
<meta name="twitter:card" content="summary_large_image">

<!-- 主屏图标 / PWA -->
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kyudai Guide">

<link rel="stylesheet" href="css/style.css?v=20260915w">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">Kyudai Guide</div>
      <div class="brand-sub" id="brandSub">九大伊都 · 留学指南 H5 版</div>
      <select id="langSwitch" class="lang-switch" aria-label="Language"></select>
      <!-- 引导跳过之后还能自己叫回来：手滑点了跳过的人，否则就再也见不到它了 -->
      <button id="tourOpen" class="tour-open" type="button">?</button>
    </div>
    <div class="search-wrap" id="searchWrap">
      <input id="searchInput" type="search" autocomplete="off">
      <button id="searchClear" class="search-clear" aria-label="清除">✕</button>
      <!-- 最近搜索：聚焦且输入为空时下拉展开。搜过的东西不该每次重打。 -->
      <div id="searchHist" class="search-hist" hidden></div>
    </div>
  </header>

  <main id="main" class="main">
    <!-- 地图：主页 -->
    <section id="pane-map" class="pane pane-map" style="display:none">
      <!-- src 延迟到用户点「地图」tab 才注入：地图数据约 500KB，
           而默认进来的人是要看指南的，不该先替他下载地图。见 app.js mountMap()
           ?v= 必须带上：app.html 会把它透传给 data/*.json（见其中的 DATA_V），
           不带的话改了数据也换不掉老用户缓存里的那份，而 HTML 却已经是新的。 -->
      <iframe id="mapFrame" title="校园地图" data-src="../h5-mvp/app.html?v=20260902" loading="lazy"></iframe>
      <div class="map-tip" id="mapTip">地图由 Kyudaimap 提供 · 支持搜索与定位</div>
    </section>

    <!-- 指南：12 品类 -->
    <section id="pane-guide" class="pane">
      <!-- 状态条：今日来访 / 下一件大事 / 福冈天气 / 阅读打卡。
           四条都是纯增强 —— 任一条拿不到数据就整条隐藏，不留空壳。 -->
      <div id="pulse" class="pulse" hidden></div>
      <!-- 宫格视图 -->
      <!-- 🆕 新生专区：服务"刚到日本"的人 —— 不复制正文，只把散在各篇的关键步骤
           按时间顺序串起来，每条用 ?sec=<区块ID> 深链到对应小节。
           数据：guide/js/data-newcomer-zone.js（校验 tools/check_newcomer_zone.js） -->
      <div id="nzWrap" style="display:none;margin-bottom:18px">
        <div class="section-head">
          <div class="section-title" id="nzTitle">落地后手续办理顺序</div>
          <div class="section-sub" id="nzSub"></div>
        </div>
        <div id="nzStages"></div>
        <!-- 必读卡，可以不止一张。先后由 content 里的 pinOrder 决定（小的在前），
             不按 updatedAt —— 那等于「谁最后被编辑谁排第一」，改个错别字就会
             把首页第一张卡换掉。校验见 tools/build_guide_articles.js -->
        <div id="pinnedCards" style="display:none;margin-top:12px"></div>
      </div>

      <div id="catGridWrap">
        <div class="section-head">
          <div class="section-title" id="guideHead">指南 · 12 场景</div>
          <div class="section-sub" id="guideSub">选一个场景直接查看指南</div>
        </div>
        <div id="catGrid" class="cat-grid"></div>
      </div>
      <!-- 列表视图（搜索结果 / 空分类提示） -->
      <div id="catListWrap" style="display:none">
        <button class="back-mini" id="catBack">‹ 全部品类</button>
        <div class="section-title" id="catListHead" style="margin:6px 0 10px"></div>
        <div id="catListArticles" class="list"></div>
      </div>
      <div id="guideEmpty" class="empty" style="display:none"></div>
      <div class="support-card" id="supportCard" hidden></div>
      <!-- 综合反馈入口：没有具体文章时用这个 -->
      <button class="fb-entry fb-entry-wide" id="btnFeedback" type="button"></button>
    </section>

    <!-- 村历 -->
    <section id="pane-cunli" class="pane" style="display:none">
      <div class="card">
        <div class="mhead">
          <button class="marrow" id="btnPrev" aria-label="上一月">‹</button>
          <button class="mtitle" id="mTitleBtn"></button>
          <button class="marrow" id="btnNext" aria-label="下一月">›</button>
          <button class="mtoday" id="btnToday" style="display:none">今天</button>
          <button class="mtoday" id="btnExportIcs" style="display:none" title="导出日历"></button>
        </div>
        <div class="wkhead" id="wkhead"></div>
        <div id="wgrid" class="wgrid"></div>
        <div id="runs" class="runs"></div>
        <div class="mfoot">
          <div class="legend" id="legendWrap"></div>
          <button class="expand" id="btnExpand">展开 ⌄</button>
        </div>
      </div>
      <div id="selCard" class="card" style="display:none">
        <div class="chead"><span class="ctitle" id="selLabel"></span><span class="csub" id="selCount"></span></div>
        <div id="selList"></div>
      </div>
      <div id="upcomingCard" class="card">
        <div class="chead"><span class="ctitle" id="upcomingTitle">接下来</span><span class="csub" id="upcomingSub">最近 3 条</span></div>
        <div id="upcomingList"></div>
      </div>
      <div id="monthCard" class="card" style="display:none">
        <div class="chead"><span class="ctitle" id="monthListTitle"></span><span class="csub" id="monthTap">点击查看详情</span></div>
        <div id="monthList"></div>
        <div id="pendingList"></div>
      </div>
      <div class="hint" id="dataSrc">数据来源：内阁府祝日 + 九州大学学年历（离线种子）</div>
    </section>

    <!-- 官网：学部 / 大学院学府 快速链接 -->
    <section id="pane-faculty" class="pane" style="display:none">
      <div class="section-head">
        <div class="section-title" id="facultyHead">院系官网</div>
        <div class="section-sub" id="facultySub">跳转各学部 / 大学院学府官方网站</div>
      </div>
      <div class="fac-group">
        <div class="fac-group-title" id="facUgTitle">学部（本科）</div>
        <div id="facUgList" class="fac-list"></div>
      </div>
      <div class="fac-group">
        <div class="fac-group-title" id="facGradTitle">大学院 学府</div>
        <div id="facGradList" class="fac-list"></div>
      </div>
      <div class="hint" id="facSrc"></div>
    </section>

    <!-- 历史 -->
    <section id="pane-history" class="pane" style="display:none">
      <div class="history-head">
        <div class="history-title" id="historyTitle">最近看过</div>
        <button id="btnClearHistory" class="btn-text">清空</button>
      </div>
      <div id="historyList" class="list"></div>
      <div id="historyEmpty" class="empty"><span id="noHistory">还没有浏览记录</span><br><span class="empty-sub" id="noHistorySub">打开一篇指南后会在这里显示</span></div>
    </section>

    <!-- 文章详情（悬浮窗：遮罩 + 底部卡片，复用村历 sheet 的设计语言） -->
        <section id="pane-article" class="pane pane-article" style="display:none" aria-label="文章详情">
          <div class="sheet-card">
            <div class="sheet-card-head">
                      <button class="back" id="btnBack">‹ 全部品类</button>
                      <button class="sheet-close" id="btnCloseArticle" aria-label="关闭">✕</button>
                    </div>
            <div id="articleHeader" class="article-header"></div>
            <nav id="toc" class="toc" style="display:none"></nav>
            <div id="articleBody" class="article-body"></div>
            <div class="article-foot">
              <div class="article-end" id="articleEnd">— 全文完 —</div>
              <!-- 纠错入口：读者发现错误时路径最短的地方。文案由 feedback.js 按语言填 -->
              <button class="fb-entry" id="btnReportArticle" type="button"></button>
              <!-- 读完只能返回宫格太断了：按宫格顺序给上一篇/下一篇 -->
              <nav id="articleNav" class="article-nav" hidden></nav>
            </div>
          </div>
          <!-- 长文（学术篇 7000px+，约 10 屏）从中间想回顶部只能一路划，
               这里给一个随滚动出现的浮动按钮。两个滚动容器都监听，
               手机是 .sheet-card、桌面 ≥1024px 是 #pane-article。 -->
          <button class="to-top" id="btnToTop" type="button" aria-label="回到顶部" hidden>↑</button>
          <!-- 反馈悬浮按钮：阅读时始终显示（参照小程序）。放左侧，避免与右侧的回顶按钮打架。
               在 #pane-article 内 → 随阅读页一起显隐，不需要额外的显示逻辑。 -->
          <button class="fb-fab" id="btnFeedbackFab" type="button"></button>
          <!-- 阅读进度：细线贴在视口顶部。两个滚动容器都能触发，逻辑同回顶按钮 -->
          <div class="read-progress" id="readProgress" hidden><i></i></div>
        </section>
  </main>

  <!-- 添加到主屏幕提示：只在浏览器真的抛出 beforeinstallprompt 时出现
       （即「可安装」且用户还没装）。iOS Safari 不抛这个事件，所以那里不显示，
       不做 UA 嗅探去猜 —— 猜错会在不支持的浏览器上给无效指引。 -->
  <div class="install-bar" id="installBar" hidden>
    <span class="install-ic">📲</span>
    <div class="install-tx">
      <div class="install-t" id="installTitle"></div>
      <div class="install-d" id="installDesc"></div>
    </div>
    <button class="install-go" id="installGo" type="button"></button>
    <button class="install-no" id="installNo" type="button" aria-label="关闭">✕</button>
  </div>

  <nav class="tabbar" aria-label="主导航">
    <button class="tab" data-tab="map" id="tabMap">地图</button>
    <button class="tab on" data-tab="guide" id="tabGuide">指南</button>
    <button class="tab" data-tab="cunli" id="tabCunli">村历</button>
    <button class="tab" data-tab="faculty" id="tabFaculty">官网</button>
    <button class="tab" data-tab="history" id="tabHistory">历史</button>
  </nav>

  <div id="detailMask" class="mask" style="display:none">
    <div class="sheet">
      <button class="sheet-close" id="btnCloseDetail">✕</button>
      <div id="detailBody"></div>
    </div>
  </div>
</div>

<script src="js/data-newcomer-zone.js?v=20260915w"></script>
<script src="js/data-categories.js?v=20260902"></script>
<script src="js/data-faculties.js?v=20260902"></script>
<script src="js/data-articles.js?v=20260915w"></script>
<script src="js/articles-i18n.js?v=20260915w"></script>
<!-- articles-body-i18n.js 不在这里加载：它是全站最大的一个文件（gzip 约 165KB），
     而中文读者一个字节都用不上。改由 app.js 的 ensureBodyI18N() 在非中文时按需并行拉。 -->
<script src="js/data-cunli.js?v=20260904"></script>
<script src="js/cunli-utils.js?v=20260906"></script>
<script src="js/cunli-export.js?v=20260910"></script>
<script src="js/i18n.js?v=20260915w"></script>
<script src="js/render.js?v=20260902"></script>
<script src="js/bus-live.js?v=20260902"></script>
<script src="js/search.js?v=20260915w"></script>
<script src="js/app.js?v=20260915w"></script>
<script src="js/pulse.js?v=20260915w"></script>
<script src="js/feedback.js?v=20260915w"></script>
<script src="js/tour.js?v=20260902"></script>
</body>
</html>
