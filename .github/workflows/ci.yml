# 内容校验 —— 每次 push / PR 都跑。
#
# 目的：让不熟悉命令行的人（老师、同学）也能安全地改内容 ——
# 在 GitHub 网页上编辑 content/*.json → 提 PR → 这里自动把关 → 你合并即可。
# 任何一项不过，PR 上会直接显示红叉和具体原因。
#
# 2026-09 改：原先这里只列了 3 个检查，而仓库里有 15 个 —— 其余 12 个只在
# 本地手动跑，靠人记得，就一定会有漏。改成调用 tools/check-all.sh：
# 新增检查只要加进那个脚本，CI 自动覆盖，不用再改这个文件。
name: 内容校验

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }

      # 单独留着这一步，因为它的报错信息是写给「不熟悉命令行的人」看的：
      # 只给一句「校验失败」，贡献者不知道要做什么。
      - name: 确认产物与 content/ 一致
        run: |
          node tools/build_guide_articles.js
          if ! git diff --quiet -- guide/js/data-articles.js; then
            echo "::error::guide/js/data-articles.js 与 content/ 不一致。"
            echo "改完 content/ 后请在本地运行： node tools/build_guide_articles.js"
            echo "并把产出的 guide/js/data-articles.js 一起提交。"
            git diff --stat -- guide/js/data-articles.js
            exit 1
          fi
          echo "✓ 产物与内容源一致"

      # 其余全部检查（DOM id / 四语译本结构 / 村历译名 / 阅读预算 /
      # 无障碍标签 / 模块测试 / 四语搜索首位命中 …）
      - name: 全量校验
        run: bash tools/check-all.sh --quick

      # 搜索基准只作参考：它是 2026-09 之前建的单语 61 条，含已知的排序缺口，
      # 拿来当门槛会拦住每一次提交。但它能立刻暴露「改动把老行为弄坏了」。
      - name: 搜索基准（参考，不拦发布）
        continue-on-error: true
        run: node tools/bench_search.js new
